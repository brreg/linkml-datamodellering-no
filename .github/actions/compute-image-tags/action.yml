name: 'Bygg image-tag-oppslag'
description: >-
  Les src/assets/containers/images.json (autoritativ kjelde for
  namn/Dockerfile/make-target per image) og reknar ut GHCR-tag-hashen for
  ALLE image med GitHub sin eigen hashFiles(). hashFiles() finst berre som
  eit "dollar-curly"-uttrykk evaluert av runneren — ikkje kallbart frå
  bash/jq ved køyretid — difor er dette den einaste staden i repoet desse
  hashFiles()-kalla skal stå. Outputen er ein superset (alle 7 image);
  kallarar som treng eit filtrert utval (t.d. berre always_required) gjer
  si eiga jq-filtrering av `images`-outputen etterpå — det er eit ekte
  ulikt behov per workflow, ikkje duplisert logikk.
outputs:
  images:
    description: 'Uendra passthrough av heile images.json som JSON-array'
    value: ${{ steps.image-tags.outputs.images }}
  image_tags:
    description: 'JSON-map {namn: hash-tag} for ALLE image i images.json'
    value: ${{ steps.image-tags.outputs.image_tags }}
runs:
  using: 'composite'
  steps:
    - name: Bygg image-tag-oppslag (autoritativ kjelde — src/assets/containers/images.json)
      id: image-tags
      shell: bash
      run: |
        echo "images=$(jq -c . src/assets/containers/images.json)" >> "$GITHUB_OUTPUT"
        cat > /tmp/image-tags.json << EOF
        {
          "linkml-local": "${{ hashFiles('src/assets/containers/Dockerfile.linkml') }}",
          "python-pytest": "${{ hashFiles('src/assets/containers/Dockerfile.python', 'src/assets/containers/requirements-python-test.txt') }}",
          "avrotize-local": "${{ hashFiles('src/assets/containers/Dockerfile.avrotize') }}",
          "asyncapi-cli-minimal": "${{ hashFiles('src/assets/containers/Dockerfile.asyncapi-cli-minimal', 'src/assets/scripts/container/asyncapi-validate.js') }}",
          "plantuml": "${{ hashFiles('src/assets/containers/Dockerfile.plantuml') }}",
          "mkdocs-local": "${{ hashFiles('src/assets/containers/Dockerfile.mkdocs') }}",
          "mcp-linkml-validator": "${{ hashFiles('src/assets/containers/Dockerfile.mcp-linkml') }}"
        }
        EOF
        echo "image_tags=$(jq -c . /tmp/image-tags.json)" >> "$GITHUB_OUTPUT"
