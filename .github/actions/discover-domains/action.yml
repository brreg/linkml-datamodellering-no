name: 'Oppdag domene'
description: >-
  Oppdagar alle domene i src/linkml/ via same autoritative kjelde som
  `make domain-<x>` sjølv brukar (make/02-schema-discovery.mk), og
  eksporterer resultatet som JSON-array og space-separert liste.
outputs:
  domains:
    description: 'JSON-array med domenenamn'
    value: ${{ steps.discover.outputs.domains }}
  domain_list:
    description: 'Space-separert liste med domenenamn'
    value: ${{ steps.discover.outputs.domain_list }}
runs:
  using: 'composite'
  steps:
    - name: Oppdag domene (autoritativ kjelde — make print-domains)
      id: discover
      shell: bash
      run: |
        # Same domeneoppdaging som make domain-<x> sjølv brukar
        # (make/02-schema-discovery.mk) — unngår hardkoda domenelister som
        # kan drifte frå kva src/linkml/ faktisk inneheld (sjå
        # specs/done/debug-referanse-nav-meny.md).
        domains_raw=$(make print-domains)
        domain_list=$(echo "$domains_raw" | tr '\n' ' ' | sed 's/[[:space:]]*$//')
        domains_json=$(printf '%s\n' "$domains_raw" | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "Domene funne: $domain_list"
        echo "domain_list=$domain_list" >> "$GITHUB_OUTPUT"
        echo "domains=$domains_json" >> "$GITHUB_OUTPUT"
