# Konfigurasjon for lychee (lenkjesjekk av .md-dokumentasjon).
# Sjå specs/done/lenkje-og-mermaid-sjekk.md for bakgrunn.

timeout = 20
max_retries = 2
retry_wait_time = 5

# Persistert lenkje-cache på tvers av CI-køyringar (via actions/cache i
# lenkje-og-mermaid-sjekk.yml) — unngår å re-sjekke dei same ~10 000 unike
# URL-ane kvar natt. 1 dag sikrar at nybrotne lenkjer framleis vert fanga
# opp innan neste døgn — sjå specs/backlog/lenkjesjekk-reduser-clock-time.md.
cache = true
max_cache_age = "1d"

# Byggoutput, ikkje kjeldekode — sjå CLAUDE.md § Katalogstruktur.
# specs/ er arkivert/planlagd spesifikasjonsdokumentasjon, aldri publisert
# portalinnhald (jf. mkdocs.yml sin docs_dir) — arkiverte spesifikasjonar
# (spesielt specs/done/) skal stå urørte (CLAUDE.md) og inneheld difor
# naturleg utdaterte lenkjer som ikkje skal rettast der — sjå
# specs/done/lenkjesjekk-3817-feil-evaluering.md.
exclude_path = ["generated", "mkdocs/site", "mkdocs/node_modules", "specs"]

# Godta redirect- og informasjonskodar i tillegg til 2xx
accept = ["100..=103", "200..=299", "300..=399"]

exclude_loopback = true

exclude = [
  # Plasshaldar-domene brukte i dokumentasjonseksempel
  "^https?://(www\\.)?example\\.(com|org|net)",
  "^https?://[^/]*\\.example\\.org",
  "^https?://(www\\.|begrep\\.)?eksempel(org)?\\.no",
  "^https?://[^/]*\\.eksempel\\.no",
  # Malmarkørar i dokumentasjon, t.d. https://<org-domene>/... eller https://{domene}/...
  "<[^>]*>",
  "\\{[^}]*\\}",
  # Lokale utviklingsadresser
  "^https?://localhost",
  "^https?://host\\.containers\\.internal",
  # Krev autentisering for uinnlogga oppslag (401 uansett kva sti/konsept
  # som sjekkast, stadfesta både på rot og under /collections/...) —
  # sjå specs/done/lenkjesjekk-3817-feil-evaluering.md
  "^https://concept-catalog\\.fellesdatakatalog\\.digdir\\.no/",
  # ADMS publishertype-termen "PrivateIndividual(s)" er den korrekte,
  # kanoniske SKOS-notasjonen i sjølve ADMS-AP-vokabularet (stadfesta mot
  # kjelde-RDF-en frå SEMICeu/ADMS-AP), men parentesane i URI-stien ser ut
  # til å bryte ruteoppslaget hjå purl.org sin nye purl.archive.org-backend
  # — stadfesta 404 med og utan URL-encoding, medan søskenterma utan
  # parentes (Company, LocalAuthority m.fl.) løyser seg korrekt (200). Ikkje
  # ei brei purl.org-eksklusjon: resten av purl.org/adms/-termane skal
  # framleis sjekkast. Sjå specs/done/lenkjesjekk-runde2-verifisering.md
  # kategori B.
  "^https?://purl\\.org/adms/publishertype/PrivateIndividual",
  # w3id.org sitt LinkML-alias for linkml:types (importert transitivt via
  # common-ap-no-schema, jf. CLAUDE.md § Importhierarki — ikkje noko repoet
  # sjølv skriv eller kan rette). Peikar via HTTP-redirect til
  # linkml.io/linkml-model/types, som er ei "mike"-versjonsrouter-side som
  # gjer redirecten vidare til reelt innhald via klientside JavaScript, ikkje
  # HTTP — usynleg for alle ikkje-JS lenkjesjekkarar (stadfesta levande for
  # nettlesarar, alltid 404 for curl/lychee). Sjå
  # specs/done/lenkjesjekk-runde2-verifisering.md kategori C.
  "^https://w3id\\.org/linkml/",
  # CHANGELOG.md-compare-lenkjer er autogenererte av release-please.
  # Stadfesta at nokre av dei refererte git-taggane manglar i repoet (t.d.
  # dcat-ap-no-v2.7.0, dqv-ap-no-v1.8.0) — ein separat feil i
  # release-please sin tag-opprettingslogikk, ikkje noko denne lenkja sjølv
  # kan rette. Sjå specs/done/lenkjesjekk-runde2-verifisering.md
  # kategori G for vidare gransking.
  "^https://github\\.com/brreg/linkml-datamodellering-no/compare/",
  # schema.fintlabs.no er default_prefix/fint:-namnerommet for alle
  # FINT-domeneskjema (fint-administrasjon, fint-arkiv, fint-common,
  # fint-okonomi, fint-personvern, fint-ressurs, fint-utdanning). Stadfesta
  # bak eit kommersielt API-tilgangsgateway (Via-header identifiserer
  # "Access Gateway") — 403 på rot/namnerom, 404 på alle testa termstiar,
  # identisk resultat med tomt/text/html/application/json/text/turtle
  # Accept-header (ikkje content negotiation, jf. xmlns.com/data.norge.no
  # under). Null arkiverte Wayback-snapshot nokosinne, verken for rota
  # eller enkeltoppslag — verten har aldri vore offentleg gjennomsøkbar.
  # URI-ane sjølve er korrekte FINT-API-identifikatorar, berre ikkje
  # offentleg browsable. Same feilklasse som concept-catalog- og
  # purl.org-eksklusjonane over. Størst enkeltkjelde til gjenståande
  # lenkjesjekk-feil identifisert (8330 lenkjeførekomstar, 934 filer i
  # mkdocs/docs/fint/). Sjå
  # specs/done/lenkjesjekk-fint-schema-fintlabs-no.md.
  "^https://schema\\.fintlabs\\.no/",
  # NGR (Nasjonale grunndata)-modellane sitt term-nivå vokabularnamnerom
  # (ngr:/ngre:/ngrp:/ngrv:-prefiksa, t.d. data.norge.no/vocabulary/ngr-adresse#)
  # er stadfesta 404 — NGR-modellane er ikkje publiserte på data.norge.no.
  # Avgrensa til ngr-prefikset (ikkje ei brei /vocabulary/-eksklusjon):
  # data.norge.no/vocabulary/cccevno er eit separat tilfelle, no eksplisitt
  # ekskludert nedanfor (jf. specs/done/lenkjesjekk-runde2-verifisering.md
  # kategori E, avgjerda om varig eksklusjon vart teken i
  # specs/done/lenkjesjekk-runde3-fiks-resterande-feil.md).
  # Merk: sjølve schema-ID-en (default_prefix, data.norge.no/ngr/<schema>/)
  # er urelatert og fungerer korrekt — berre vokabularnamnerommet er
  # ekskludert her. Sjå specs/done/lenkjesjekk-ngr-vocabulary-namespace.md.
  "^https://data\\.norge\\.no/vocabulary/ngr-",
  # CPSV-AP-NO sitt cccevno-vokabularnamnerom (t.d.
  # data.norge.no/vocabulary/cccevno#isDescribedBy) — stadfesta reelt
  # backend-404 (JSON {"detail": "Not Found"}) uavhengig av Accept-header,
  # retesta to gonger. Same feilklasse som NGR-namnerommet over: namnerommet
  # er ikkje publisert på data.norge.no. Sjå
  # specs/done/lenkjesjekk-runde2-verifisering.md kategori E og
  # specs/done/lenkjesjekk-runde3-fiks-resterande-feil.md kategori C1.
  "^https://data\\.norge\\.no/vocabulary/cccevno",
  # SKOS-AP-NO/begrepskatalog sine skosno-vokabulartermar kilde-type og
  # associative-relation-role — stadfesta reelt 404 (same backend-mønster
  # som cccevno over), uavhengig av Accept-header. Avgrensa til dei to
  # konkrete termane (ikkje ei brei /vocabulary/skosno/-eksklusjon — andre
  # skosno-termar kan vere gyldige). Sjå
  # specs/done/lenkjesjekk-runde3-fiks-resterande-feil.md kategori C3.
  "^https://data\\.norge\\.no/vocabulary/skosno/(kilde-type|associative-relation-role)",
  # EU Publications Office sitt euvoc-ontologinamnerom (t.d.
  # publications.europa.eu/ontology/euvoc#XlNote) — stadfesta reelt 404:
  # 301-redirect til publications.europa.eu/resource/ontology/euvoc, som
  # sjølv gjev 404, identisk med og utan nettlesar-Accept-header. Sjå
  # specs/done/lenkjesjekk-runde3-fiks-resterande-feil.md kategori C2.
  "^https?://publications\\.europa\\.eu/ontology/euvoc",
  # GoatCounter-analytics-endepunktet nemnt i monitorering.md — stadfesta
  # reelt 400 Bad Request på ein bar rot-GET (uavhengig av Accept-header),
  # truleg fordi endepunktet krev spesifikke query-parametrar/metode og
  # ikkje er meint som ei browsable side. Berre denne eine URL-en, ikkje eit
  # breitt brukt namnerom. Sjå
  # specs/done/lenkjesjekk-runde3-fiks-resterande-feil.md kategori C4.
  "^https://brreg-linkml\\.goatcounter\\.com/$",
  # LinkML gen-doc si eiga docgen-pipeline strippar backticks (kode-span)
  # frå description-felt ved rendring til slot-/klasse-sider, slik at
  # plassholdarsyntaksen `https://psi.norge.no/los/tema/<namn>` (korrekt
  # verna med backticks i kjeldeskjemaet) endar opp som bar prosa i den
  # genererte sida — lychee sin bare-URL-detektor stoppar då ved `<` og
  # ekstraherer ein trunkert URL utan temanamn. Eksakt-treff (trailing
  # slash utan suffiks) sidan reell bruk alltid har eit temanamn etter
  # skråstreken. Rotårsak (LinkML-intern, ikkje vår eigen mal-kode) er
  # dokumentert i bugs/linkml-docgen-strip-backtick-description.md. Sjå
  # specs/done/lenkjesjekk-runde3-fiks-resterande-feil.md kategori D2.
  "^https://psi\\.norge\\.no/los/tema/$",
]

# purl.org (dct:/adms:-namnerom, jf. CLAUDE.md § Standardprefix) opptrer i
# svært mange genererte sider og rate-limitar oss ved global concurrency —
# sjå specs/done/lenkjesjekk-purl-org-429.md. Verdiane er stramma inn frå
# opphavleg konservative concurrency=2/1s etter at retry/backoff vart
# stadfesta robust — sjå specs/backlog/lenkjesjekk-reduser-clock-time.md.
[hosts."purl.org"]
concurrency = 3
request_interval = "500ms"

# Begge vertane under gjer ekte HTTP content negotiation og returnerer 404
# for eit bart oppslag utan Accept-header (lychee sin standardåtferd),
# sjølv om ressursen er fullt fungerande for ein nettlesar — stadfesta ved
# manuell verifisering. Sjå
# specs/done/lenkjesjekk-runde2-verifisering.md kategori D og F.
[hosts."xmlns.com"]
headers = { "accept" = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" }

# Testa mot alle path-typar verten brukast til i repoet (schema-ID-ar under
# /ap-no/, /fint/ osb., /concepts/<uuid>, /organizations/<orgnr>) — same
# Accept-header fungerer identisk (200) for alle, så trygt å setje globalt
# for verten. /vocabulary/cccevno held fram med å vere eit ekte 404
# uavhengig av header (sjå kategori E — ingen eksklusjon der, framleis ope).
[hosts."data.norge.no"]
headers = { "accept" = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" }
