# Konfigurasjon for lychee (lenkjesjekk av .md-dokumentasjon).
# Sjå specs/done/lenkje-og-mermaid-sjekk.md for bakgrunn.

timeout = 20
max_retries = 2
retry_wait_time = 5

# Persistert lenkje-cache på tvers av CI-køyringar (via actions/cache i
# lenkje-og-mermaid-sjekk.yml) — unngår å re-sjekke dei same ~10 000 unike
# URL-ane kvar natt. 1 dag sikrar at nybrotne lenkjer framleis vert fanga
# opp innan neste døgn — sjå specs/backlog/lenkjesjekk-reduser-clock-time.md.
cache = true
max_cache_age = "1d"

# Byggoutput, ikkje kjeldekode — sjå CLAUDE.md § Katalogstruktur.
# specs/ er arkivert/planlagd spesifikasjonsdokumentasjon, aldri publisert
# portalinnhald (jf. mkdocs.yml sin docs_dir) — arkiverte spesifikasjonar
# (spesielt specs/done/) skal stå urørte (CLAUDE.md) og inneheld difor
# naturleg utdaterte lenkjer som ikkje skal rettast der — sjå
# specs/done/lenkjesjekk-3817-feil-evaluering.md.
exclude_path = ["generated", "mkdocs/site", "specs"]

# Godta redirect- og informasjonskodar i tillegg til 2xx
accept = ["100..=103", "200..=299", "300..=399"]

exclude_loopback = true

exclude = [
  # Plasshaldar-domene brukte i dokumentasjonseksempel
  "^https?://(www\\.)?example\\.(com|org|net)",
  "^https?://[^/]*\\.example\\.org",
  "^https?://(www\\.|begrep\\.)?eksempel(org)?\\.no",
  "^https?://[^/]*\\.eksempel\\.no",
  # Malmarkørar i dokumentasjon, t.d. https://<org-domene>/... eller https://{domene}/...
  "<[^>]*>",
  "\\{[^}]*\\}",
  # Lokale utviklingsadresser
  "^https?://localhost",
  "^https?://host\\.containers\\.internal",
  # Krev autentisering for uinnlogga oppslag (401 uansett kva sti/konsept
  # som sjekkast, stadfesta både på rot og under /collections/...) —
  # sjå specs/done/lenkjesjekk-3817-feil-evaluering.md
  "^https://concept-catalog\\.fellesdatakatalog\\.digdir\\.no/",
]

# purl.org (dct:/adms:-namnerom, jf. CLAUDE.md § Standardprefix) opptrer i
# svært mange genererte sider og rate-limitar oss ved global concurrency —
# sjå specs/done/lenkjesjekk-purl-org-429.md. Verdiane er stramma inn frå
# opphavleg konservative concurrency=2/1s etter at retry/backoff vart
# stadfesta robust — sjå specs/backlog/lenkjesjekk-reduser-clock-time.md.
[hosts."purl.org"]
concurrency = 3
request_interval = "500ms"
