name: Trivy

on:
  push:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '**/requirements*.txt'
      - 'src/assets/containers/**'
  schedule:
    - cron: '0 6 * * 2'   # tirsdag morgen

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  scan-requirements:
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Éin skanning av heile repoet i staden for 4 separate fs-skanningar
      # (éin per requirements.txt) — same scan-ref: .-mønster som
      # generate-sbom-jobben under alt brukar. Trivy sin fs-scan finn alle
      # avhengigheitsfiler (requirements.txt, Dockerfile osv.) rekursivt i
      # éin gjennomgang, så granulariteten (kva fil eit funn kjem frå) går
      # ikkje tapt — berre talet på separate Trivy-DB-oppslag/prosessar.
      - name: Skann heile repoet for sårbare avhengigheiter
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Last opp trivy-results.sarif til GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  generate-sbom:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Generer SBOM for hele repoet
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: sbom.spdx.json

      - name: Last opp SBOM som artefakt
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90
