name: Lenkje- og mermaid-sjekk

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *' # Kvar natt kl. 06:00 UTC

jobs:
  checkout-source:
    # Genererer generated/-innhaldet lenkjesjekk-jobben treng for å køyre
    # make docs-publish/docs-build — utan dette ville lychee aldri sjå dei
    # genererte per-domene-dokumentasjonssidene (dei er .gitignore-a, jf.
    # spec-en). Sjølvstendig frå generate.yml (triggerar berre på push til
    # main, ikkje eige schedule), men byggjer på dei same delte actionane
    # som generate.yml no brukar — sjå
    # specs/done/lenkjesjekk-dekk-genererte-sider-nattleg.md.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.discover.outputs.domains }}
      domain_list: ${{ steps.discover.outputs.domain_list }}
      images: ${{ steps.image-tags.outputs.images }}
      image_tags: ${{ steps.image-tags.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Oppdag domene
        id: discover
        uses: ./.github/actions/discover-domains
      - name: Bygg image-tag-oppslag
        id: image-tags
        uses: ./.github/actions/compute-image-tags
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            src/
            mkdocs/
            .github/
            Makefile
            make/
            README.md
            CODEOWNERS.md
          retention-days: 1
          include-hidden-files: true

  # Sikrar at kvart nødvendig image finst i GHCR (bygg + push berre viss det
  # manglar, via skopeo-sjekk) FØR generate-matrisa treng dei — utan denne
  # jobben fell kvar av dei ${{ ... }} matrise-cellene i generate tilbake til
  # eit eige lokalt bygg viss eit image-tag manglar i GHCR, som i verste
  # fall gjev duplisert byggjekostnad multiplisert med talet på celler. Same
  # jobb som generate.yml (line 75–122) — sjå
  # specs/backlog/lenkjesjekk-reduser-clock-time.md.
  ensure-images:
    name: "build-image / ${{ matrix.image.name }}"
    needs: [checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJson(needs.checkout-source.outputs.images) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Oppgrader crun
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sikre ${{ matrix.image.name }} i GHCR
        uses: ./.github/actions/ensure-image
        with:
          name: ${{ matrix.image.name }}
          tag: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ fromJson(needs.checkout-source.outputs.image_tags)[matrix.image.name] }}
          make_target: ${{ matrix.image.make_target }}

      # lychee er eit tredjeparts, ferdigbygd image (docker.io) — ikkje eit
      # av våre eigne images.json-image, difor ikkje via ensure-image
      # (som byggjer+pushar til vårt eige GHCR). Samla likevel her, saman
      # med resten av "sikre image er klare"-arbeidet, i staden for som eit
      # eige seint steg midt i lenkjesjekk-jobben. Merk: kvar jobb køyrer på
      # eigen runner, så dette overfører ikkje biletet til lenkjesjekk sin
      # runner — `podman run` der pullar framleis sjølv om det manglar
      # lokalt. Sjå specs/backlog/lenkjesjekk-reduser-clock-time.md.
      - name: Trekk inn lychee
        run: podman pull docker.io/lycheeverse/lychee:latest

  generate:
    name: "generate / ${{ matrix.domain }}"
    needs: [ensure-images, checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        domain: ${{ fromJson(needs.checkout-source.outputs.domains) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Cache genererte artefakter (${{ matrix.domain }})
        id: cache-generated
        uses: actions/cache@v6
        with:
          path: generated/${{ matrix.domain }}/
          # Nøkkel-formel MÅ vere byte-for-byte identisk med generate.yml sin
          # tilsvarande "Cache genererte artefakter"-steg — dei to deler
          # cache-innslag på tvers av workflowar i same repo, sidan GitHub
          # Actions-cache ikkje er isolert per workflow. Sjå generate.yml
          # for grunngjeving av den eksplisitte fil-lista (innsnevra frå
          # breie 'src/assets/scripts/**' i
          # specs/done/scripts-glob-cache-miss-generate-jobb.md — denne fila
          # dreiv frå den fiksen fram til
          # specs/done/evaluering-gjentakande-monster-backlog.md (P3) fanga
          # avviket), og specs/backlog/lenkjesjekk-reduser-clock-time.md for
          # kvifor cross-workflow-delinga vart lagt til her.
          key: v4-generated-${{ matrix.domain }}-${{ hashFiles(format('src/linkml/{0}/**', matrix.domain)) }}-infra-${{ hashFiles('src/assets/containers/Dockerfile.linkml', 'src/assets/containers/Dockerfile.avrotize', 'src/assets/containers/Dockerfile.asyncapi-cli-minimal', 'src/assets/scripts/makefile/**', 'src/assets/scripts/scaffolding/resolve-catalog-slug.sh', 'src/assets/scripts/utils/**', 'src/assets/templates/**', 'make/00-settings.mk', 'make/01-containers.mk', 'make/02-schema-discovery.mk', 'make/03-output.mk', 'make/10-generator-macros.mk', 'make/11-generator-targets.mk', 'make/20-domain-targets.mk', 'make/30-instances.mk', 'make/40-validation.mk', 'make/80-images.mk', 'Makefile') }}

      - name: Oppgrader crun
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detekter påkrevde images for ${{ matrix.domain }}
        if: steps.cache-generated.outputs.cache-hit != 'true'
        id: detect-images
        uses: ./.github/actions/detect-required-images
        with:
          domain: ${{ matrix.domain }}

      - name: Last images inn i podman frå GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/pull-images
        with:
          images: ${{ steps.detect-images.outputs.images }}
          image_tags: ${{ needs.checkout-source.outputs.image_tags }}

      - name: Generer alle artefakter for ${{ matrix.domain }}
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/generate-domain
        with:
          domain: ${{ matrix.domain }}

      - uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.domain }}
          path: generated/${{ matrix.domain }}/
          retention-days: 1

  mermaid-render:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Trekk ut mermaid-blokker frå .md-filer
        run: |
          set -uo pipefail
          mkdir -p /tmp/mermaid/blocks
          manifest=/tmp/mermaid/manifest.tsv
          : > "$manifest"

          open_re='^```mermaid[[:space:]]*$'
          close_re='^```[[:space:]]*$'

          # git ls-files avgrensar til versjonskontrollerte filer — hoppar automatisk
          # over generated/ og andre .gitignore-a byggoutput utan behov for eksplisitt filter.
          # :!specs/** ekskluderer arkiverte/planlagde spesifikasjonar — dei er aldri
          # del av mkdocs/docs/ (den publiserte portalen) og inneheld naturleg
          # kodeutdrag/utkast/plasshaldarar med ```mermaid-fencing som aldri var meint
          # å rendrast åleine — sjå specs/done/mermaid-render-ekskluder-specs.md
          block_id=0
          while IFS= read -r -d '' file; do
            block=0
            in_block=0
            blockfile=""
            while IFS= read -r line || [ -n "$line" ]; do
              if [ "$in_block" -eq 0 ] && [[ "$line" =~ $open_re ]]; then
                in_block=1
                block=$((block + 1))
                block_id=$((block_id + 1))
                blockfile="/tmp/mermaid/blocks/block-${block_id}.mmd"
                : > "$blockfile"
                printf '%s\t%s\t%s\n' "$block_id" "$file" "$block" >> "$manifest"
                continue
              fi
              if [ "$in_block" -eq 1 ] && [[ "$line" =~ $close_re ]]; then
                in_block=0
                continue
              fi
              if [ "$in_block" -eq 1 ]; then
                printf '%s\n' "$line" >> "$blockfile"
              fi
            done < "$file"
          done < <(git ls-files -z -- '*.md' ':!specs/**')

          echo "Fann $block_id mermaid-blokker."

      - name: Trekk inn mermaid-cli
        run: podman pull docker.io/minlag/mermaid-cli:latest

      - name: Rendra kvar mermaid-blokk
        run: |
          set -uo pipefail
          manifest=/tmp/mermaid/manifest.tsv
          report=mermaid-render-report.md
          echo "| Fil | Diagram # | Status |" > "$report"
          echo "|---|---|---|" >> "$report"

          total=0
          fail=0
          if [ -s "$manifest" ]; then
            while IFS=$'\t' read -r id src idx; do
              total=$((total + 1))
              blockfile="/tmp/mermaid/blocks/block-${id}.mmd"
              logfile="/tmp/mermaid/blocks/block-${id}.log"
              # --user 0:0 er naudsynt: mermaid-cli-biletet køyrer som uid 1001,
              # men i podman rootless vert monterte filer eigd av "root" i
              # containerens brukarnavnerom — 1001 manglar skrivetilgang utan dette
              if podman run --rm --user 0:0 -v /tmp/mermaid/blocks:/data docker.io/minlag/mermaid-cli:latest \
                   -i "/data/block-${id}.mmd" -o "/data/block-${id}.svg" \
                   > "$logfile" 2>&1; then
                echo "| $src | $idx | OK |" >> "$report"
              else
                fail=$((fail + 1))
                echo "| $src | $idx | **FEIL** |" >> "$report"
                message=$(tail -n 5 "$logfile" | tr '\n' ' ' | sed 's/"/'"'"'/g')
                echo "::warning file=${src}::${src} (diagram nr. ${idx}) rendrar ikkje: ${message}"
              fi
            done < "$manifest"
          fi

          {
            echo ""
            echo "**Totalt: ${total} diagram, ${fail} feila.**"
          } >> "$report"

          echo ""
          echo "== Mermaid-rendering: oppsummering =="
          cat "$report"

          {
            echo "## Mermaid-rendering"
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp mermaid-rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mermaid-render-report
          path: mermaid-render-report.md
          retention-days: 30

  mermaid-click-href-sjekk:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      # 5 er empirisk stadfesta trygt saman med retry/backoff-logikken i
      # check-mermaid-click-hrefs.py (0 av 5757 sider feila i lokal
      # verifisering) — sjå specs/done/mermaid-click-href-429-retry.md.
      CLICK_HREF_SJEKK_CONCURRENCY: 5
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      # Evaluerer mermaid `click <Navn> href "..."`-direktiv i klassediagram
      # på den publiserte portalen. Desse er usynlege for mkdocs sin eigen
      # lenkje-validator (jf. validation.links i mkdocs.yml), sidan han berre
      # ser rendra <a href>-element — ikkje rå tekst inni fenced code-blokker.
      # Gjenbrukar den til ei kvar tid publiserte GitHub Pages-portalen
      # (deploya av generate.yml) i staden for å byggje portalen på nytt her
      # — sjå specs/backlog/mermaid-klikkbare-lenker-404.md.
      - name: Evaluer mermaid click-hrefs i publisert portal
        run: |
          python3 mkdocs/lib/scripts/check-mermaid-click-hrefs.py \
            https://brreg.github.io/linkml-datamodellering-no \
            --concurrency "$CLICK_HREF_SJEKK_CONCURRENCY" \
            --report click-href-sjekk-report.md

      - name: Skriv oppsummering
        if: always()
        run: |
          {
            echo "## Mermaid click-href-sjekk"
            cat click-href-sjekk-report.md 2>/dev/null || echo "Ingen rapport generert (skriptet feila før rapportering)."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Last opp click-href-rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: click-href-sjekk-report
          path: click-href-sjekk-report.md
          retention-days: 30

  lenkjesjekk:
    needs: [checkout-source, generate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      # Full checkout (ikkje source-artifacten frå checkout-source) — lychee
      # skal framleis dekkje ALLE .md-filer i repoet (spesifikasjonar,
      # CONVENTIONS.md, GOVERNANCE.md m.fl.), ikkje berre det avgrensa
      # filsettet checkout-source lastar opp for domenegenereringa.
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Slå saman genererte domene-artefakt til generated/
        uses: ./.github/actions/merge-generated-artifacts
        with:
          domain_list: ${{ needs.checkout-source.outputs.domain_list }}

      - name: Logg inn på GHCR
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Last mkdocs-local og python-pytest frå GHCR (parallelt)
        uses: ./.github/actions/pull-images
        with:
          images: '[{"name":"mkdocs-local","make_target":"build-docker-mkdocs"},{"name":"python-pytest","make_target":"build-docker-python"}]'
          image_tags: ${{ needs.checkout-source.outputs.image_tags }}

      - name: Cache publisert dokumentasjonsportal
        id: cache-docs
        uses: actions/cache@v6
        with:
          path: |
            mkdocs/docs
            mkdocs/site
          # Hashar KJELDA (src/linkml/**), ikkje det genererte outputet
          # (generated/**) — LinkML sin SHACL-generator bakar eit ferskt
          # linkml:generation_date-tidsstempel (+ ikkje-deterministisk
          # blankenode-rekkjefølgje) inn i kvar .ttl-fil ved kvar
          # genereringshending, så generated/**-hashen er aldri stabil
          # mellom separate genereringar sjølv med uendra kjelde — stadfesta
          # empirisk 2026-08-16, sjå
          # specs/backlog/lenkjesjekk-reduser-clock-time.md § tiltak 2.
          # "infra"-delen listar publish.sh sine eigne kjelder
          # (mkdocs/lib/**, README.md → index.md, policies/README.md →
          # valideringsregler.md) og dei statiske rettleiingskatalogane
          # publish.sh medvite ikkje rører (jf. publish.sh line ~171 sin
          # explicit continue-liste) — same eksplisitte fil-liste-prinsipp
          # som generate.yml (unngår at eit breitt mønster invaliderer
          # cachen ved urelaterte endringar, jf.
          # specs/done/docs-only-endring-cache-miss-alle-domene.md).
          key: v2-docs-${{ hashFiles('src/linkml/**') }}-infra-${{ hashFiles('mkdocs/publish.sh', 'mkdocs/lib/**', 'README.md', 'src/mcp-linkml-validator/policies/README.md', 'src/assets/scripts/makefile/generate-readme-tables.sh', 'mkdocs/docs/kom-i-gang/**', 'mkdocs/docs/arkitektur/**', 'mkdocs/docs/publisering/**', 'mkdocs/docs/automasjon/**', 'mkdocs/docs/stylesheets/**', 'mkdocs/docs/javascripts/**', 'make/50-docs.mk', 'Makefile') }}

      - name: Publiser og bygg dokumentasjonsportal
        if: steps.cache-docs.outputs.cache-hit != 'true'
        env:
          LOGLVL: DEBUG
        run: |
          set -uo pipefail
          if ! make docs-publish; then
            echo "::error::make docs-publish feila"
            exit 1
          fi

          make docs-build 2>&1 | tee docs-build.log
          build_rc=${PIPESTATUS[0]}

          {
            echo "## MkDocs build-åtvaringar"
            if grep -qE "WARNING|ERROR" docs-build.log; then
              echo '```'
              grep -E "WARNING|ERROR" docs-build.log
              echo '```'
            else
              echo "Ingen WARNING/ERROR frå \`make docs-build\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$build_rc"

      - name: Hopp over bygg (cache-treff)
        if: steps.cache-docs.outputs.cache-hit == 'true'
        run: |
          echo "Cache-treff for mkdocs/docs + mkdocs/site (uendra generated/ og publish.sh-kjelder) — hoppar over docs-publish/docs-build."
          {
            echo "## MkDocs build-åtvaringar"
            echo "Cache-treff — docs-publish/docs-build hoppa over sidan innhaldet er uendra. Byggjevarsel vart sist sjekka då cachen vart skriven."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache lychee sitt lenkje-cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          # Alltid unik nøkkel (run_id) → alltid ny cache lagra ved jobbslutt;
          # restore-keys hentar siste tilgjengelege cache uavhengig av
          # eksakt nøkkel, slik at kvar køyring byggjer vidare på førre —
          # sjå specs/backlog/lenkjesjekk-reduser-clock-time.md.
          key: lychee-cache-${{ github.run_id }}
          restore-keys: |
            lychee-cache-

      - name: Sjekk lenkjer i dokumentasjon
        run: |
          set -uo pipefail
          podman run --rm -v "$PWD:/repo:Z" -w /repo docker.io/lycheeverse/lychee:latest \
            --config .github/lychee.toml \
            --no-progress \
            --format markdown \
            --output lenkjesjekk-report.md \
            '**/*.md' || true

          if [ ! -f lenkjesjekk-report.md ]; then
            echo "# Lenkjesjekk" > lenkjesjekk-report.md
            echo "Ingen rapport vart generert (lychee feila før rapportering)." >> lenkjesjekk-report.md
          fi

          # Rapporten kan vere svært stor (tusenvis av linjer) — logg berre
          # lychee sin eigen kompakte "# Summary"-tabell til jobb-loggen, ikkje
          # heile rapporten. Full liste over brotne lenkjer finst i Step
          # Summary og i den opplasta artefakten.
          echo ""
          echo "== Lenkjesjekk: oppsummering =="
          if grep -q '^# Summary' lenkjesjekk-report.md; then
            awk '/^# Summary/{p=1} /^## Errors per input/{p=0} p' lenkjesjekk-report.md
            echo "(Fullstendig liste over brotne lenkjer: sjå Step Summary eller opplasta artefakt 'lenkjesjekk-report')"
          else
            cat lenkjesjekk-report.md
          fi

          {
            echo "## Lenkjesjekk"
            cat lenkjesjekk-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp lenkjesjekk-rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lenkjesjekk-report
          path: lenkjesjekk-report.md
          retention-days: 30
