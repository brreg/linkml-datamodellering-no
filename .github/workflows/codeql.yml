name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # måndag 02:00 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyser (${{ matrix.language }})
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - mkdocs/node_modules/**
              - mkdocs/site/**
              - generated/**
              - mkdocs/docs/**/*-model.py

      - name: Analyser
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
