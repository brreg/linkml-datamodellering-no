name: Generate and publish

# Tidlegare kjent race condition mot release-please.yml sin
# schema-versjons-oppdateringsjobb: denne workflowen kunne køyre to gonger
# per release (éin gong på data frå før versjonsoppdateringa, éin gong
# korrigert). `concurrency`-blokka under løyser dette — når det korrigerte
# løpet startar, vert det førre, no utdaterte løpet kansellert automatisk.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/linkml/**'
      - 'src/assets/containers/**'
      - 'src/assets/templates/**'
      - 'src/assets/scripts/**'
      - 'mkdocs/**'
      - 'README.md'
      - 'Makefile'

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  checkout-source:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.discover.outputs.domains }}
      domain_list: ${{ steps.discover.outputs.domain_list }}
      images: ${{ steps.image-tags.outputs.images }}
      image_tags: ${{ steps.image-tags.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Oppdag domene
        id: discover
        uses: ./.github/actions/discover-domains
      - name: Bygg image-tag-oppslag (autoritativ kjelde — src/assets/containers/images.json)
        id: image-tags
        run: |
          # Namn/Dockerfile/make-target for kvart image kjem frå images.json —
          # einaste staden dei skal skrivast. GHCR-tag-hashen må derimot
          # framleis reknast ut med GitHub sin eigen hashFiles(), som berre
          # finst som eit "dollar-curly"-uttrykk evaluert ved parse-tid (ikkje
          # kallbar frå bash/jq ved køyretid) — difor er dette den EINASTE
          # staden i heile workflowen desse hashFiles()-kalla skal stå.
          # Både ensure-images og generate-jobben slår opp taggen herifrå,
          # i staden for å rekne han ut på nytt kvar for seg (som før).
          echo "images=$(jq -c . src/assets/containers/images.json)" >> "$GITHUB_OUTPUT"
          cat > /tmp/image-tags.json << EOF
          {
            "linkml-local": "${{ hashFiles('src/assets/containers/Dockerfile.linkml') }}",
            "python-pytest": "${{ hashFiles('src/assets/containers/Dockerfile.python', 'src/assets/containers/requirements-python-test.txt') }}",
            "avrotize-local": "${{ hashFiles('src/assets/containers/Dockerfile.avrotize') }}",
            "asyncapi-cli-minimal": "${{ hashFiles('src/assets/containers/Dockerfile.asyncapi-cli-minimal', 'src/assets/scripts/container/asyncapi-validate.js') }}",
            "plantuml": "${{ hashFiles('src/assets/containers/Dockerfile.plantuml') }}",
            "mkdocs-local": "${{ hashFiles('src/assets/containers/Dockerfile.mkdocs') }}",
            "mcp-linkml-validator": "${{ hashFiles('src/assets/containers/Dockerfile.mcp-linkml') }}"
          }
          EOF
          echo "image_tags=$(jq -c . /tmp/image-tags.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            src/
            mkdocs/
            .github/
            Makefile
            make/
            README.md
            CODEOWNERS.md
          retention-days: 1
          include-hidden-files: true

  ensure-images:
    name: "build-image / ${{ matrix.image.name }}"
    needs: [checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      # Image-lista kjem frå src/assets/containers/images.json (autoritativ
      # kjelde, lasta via checkout-source sitt image-tags-steg) — ikkje
      # hardkoda her lenger.
      matrix:
        image: ${{ fromJson(needs.checkout-source.outputs.images) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Logg artifact-innhald og miljøinfo
        run: |
          echo "=== Artifact-innhald etter download ==="
          ls -lah src/assets/containers/ 2>/dev/null || echo "src/assets/containers/ finst ikkje"
          ls -lah ${{ matrix.image.dockerfile }} 2>/dev/null || echo "${{ matrix.image.dockerfile }} finst ikkje"
          echo ""
          echo "=== Disk-bruk ==="
          df -h
          echo ""
          echo "=== Versjonsinformasjon ==="
          echo "podman: $(podman --version)"
          echo "crun: $(crun --version | head -1)"
          echo "skopeo: $(skopeo --version)"

      - name: Oppgrader crun
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sikre ${{ matrix.image.name }} i GHCR
        uses: ./.github/actions/ensure-image
        with:
          name: ${{ matrix.image.name }}
          tag: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ fromJson(needs.checkout-source.outputs.image_tags)[matrix.image.name] }}
          make_target: ${{ matrix.image.make_target }}

  generate:
    name: "generate / ${{ matrix.domain }}"
    needs: [ensure-images, checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
      packages: read
    strategy:
      matrix:
        domain: ${{ fromJson(needs.checkout-source.outputs.domains) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Logg artifact-innhald (${{ matrix.domain }})
        run: |
          echo "=== Artifact-innhald etter download ==="
          ls -lah src/linkml/${{ matrix.domain }}/ 2>/dev/null || echo "src/linkml/${{ matrix.domain }}/ finst ikkje"
          echo ""
          echo "=== Skjema i domenet ==="
          find src/linkml/${{ matrix.domain }} -name "*-schema.yaml" 2>/dev/null || echo "Ingen skjema funne"
          echo ""
          echo "=== Disk-bruk ==="
          df -h

      - name: Cache genererte artefaktar (${{ matrix.domain }})
        id: cache-generated
        uses: actions/cache@v6
        with:
          path: generated/${{ matrix.domain }}/
          key: v4-generated-${{ matrix.domain }}-${{ hashFiles(format('src/linkml/{0}/**', matrix.domain)) }}-infra-${{ hashFiles('src/assets/containers/Dockerfile.linkml', 'src/assets/containers/Dockerfile.avrotize', 'src/assets/containers/Dockerfile.asyncapi-cli-minimal', 'src/assets/scripts/**', 'src/assets/templates/**', 'Makefile') }}

      - name: Oppgrader crun
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Detekter påkrevde images for ${{ matrix.domain }}
        if: steps.cache-generated.outputs.cache-hit != 'true'
        id: detect-images
        run: |
          echo "=== Analyserer kva images ${{ matrix.domain }} treng ==="
          IMAGES_MANIFEST="src/assets/containers/images.json"

          # Base images som alltid trengs (always_required i images.json)
          mapfile -t REQUIRED_IMAGES < <(jq -r '.[] | select(.always_required) | .name' "$IMAGES_MANIFEST")

          # Sjekk alle build.yaml i domenet mot dei betinga imaga
          # (required_if_generator_flag i images.json)
          for build_yaml in src/linkml/${{ matrix.domain }}/*/build.yaml; do
            if [ ! -f "$build_yaml" ]; then
              continue
            fi

            while IFS=$'\t' read -r img flag; do
              if grep -q "^  $flag: true" "$build_yaml" 2>/dev/null; then
                if [[ ! " ${REQUIRED_IMAGES[@]} " =~ " $img " ]]; then
                  REQUIRED_IMAGES+=("$img")
                fi
              fi
            done < <(jq -r '.[] | select(.required_if_generator_flag != null) | [.name, .required_if_generator_flag] | @tsv' "$IMAGES_MANIFEST")
          done

          echo "Påkrevde images:"
          for img in "${REQUIRED_IMAGES[@]}"; do
            echo "  - $img"
          done

          # Eksporter som output (space-separated)
          echo "images=${REQUIRED_IMAGES[*]}" >> $GITHUB_OUTPUT

      - name: Last images inn i podman frå GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          echo "=== Pullar images frå GHCR (parallelt) ==="
          pull_image() {
            local local_tag="$1" ghcr_tag="$2" make_target="$3"
            local start=$(date +%s%3N)
            echo "→ Prøver å pulle $ghcr_tag"
            if podman pull "$ghcr_tag" 2>&1; then
              podman tag "$ghcr_tag" "$local_tag"
              local elapsed=$(( $(date +%s%3N) - start ))
              printf "✓ Henta %s frå GHCR (%d.%ds)\n" "$local_tag" $((elapsed / 1000)) $((elapsed % 1000 / 100))
              echo "  Inspekterer image:"
              podman inspect "$local_tag" | grep -E "ManifestType|Created" | head -5
            else
              echo "⚠ GHCR-pull feila for $local_tag — byggjer lokalt"
              set -x
              make "$make_target"
              set +x
            fi
          }

          # Pull berre images som domenet faktisk treng — namn/make-target
          # kjem frå images.json, tag frå den førehandsrekna tag-mappa i
          # checkout-source (sjå kommentar der for kvifor hashFiles() ikkje
          # kan reknast ut på nytt her).
          IMAGES_MANIFEST="src/assets/containers/images.json"
          IMAGE_TAGS='${{ needs.checkout-source.outputs.image_tags }}'
          for img in ${{ steps.detect-images.outputs.images }}; do
            make_target=$(jq -r --arg n "$img" '.[] | select(.name==$n) | .make_target' "$IMAGES_MANIFEST")
            tag=$(echo "$IMAGE_TAGS" | jq -r --arg n "$img" '.[$n]')
            pull_image "localhost/$img:latest" "ghcr.io/${{ github.repository_owner }}/$img:$tag" "$make_target" &
          done

          wait
          echo "=== Alle pull-jobbar fullførte ==="
          echo "Lokale images:"
          podman images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.Created}}" | grep -E "localhost/(linkml-local|python-pytest|avrotize-local|asyncapi-cli-minimal|plantuml|mcp-linkml-validator)" || echo "Ingen images funne"

      - name: Valider alle skjema for ${{ matrix.domain }}
        # Einaste kontrollen mot innhaldet ETTER release-please sin
        # [skip ci]-versjonsbump (sjå release-please.yml, steget "Oppdater
        # schema-versjonar i release-PR") — validate.yml validerer aldri
        # denne konkrete, versjonsoppdaterte skjema-tilstanden før merge,
        # sidan den bump-commiten går rett til PR-branchen med [skip ci].
        # Feilar difor bygget ved reell valideringsfeil i staden for å
        # svelgje feilkoden — sjå ikkje på dette som dobbeltarbeid og fjern
        # det ikkje utan å løyse [skip ci]-gapet på annan måte fyrst.
        if: steps.cache-generated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Validerer skjema for ${{ matrix.domain }} ==="

          # Køyr validering for alle build.yaml med generators:-blokk, parallelt.
          # Kvart run-validation.sh-kall flatar ut og validerer berre sitt eige
          # skjema (unik mktemp-fil, unik loggsti) — heilt isolert frå andre
          # skjema sin køyring, så parallellisering av løkka er trygt. Same
          # &-/PIDS-/wait-mønster som mkdocs/publish.sh (Steg 2) brukar for
          # parallell skjemagenerering.
          # Ekskluder begrepssamling-* (same filter som validate.yml sin
          # validate-jobb) — desse er konseptsamlingar utan skjemafil, sjølv
          # om build.yaml deira har eit generators:-avsnitt (alle flagg
          # false); utan filteret feilar run-validation.sh alltid med
          # "Fann ingen *-schema.yaml".
          declare -a PIDS=()
          declare -a MANIFESTS=()
          for manifest in $(find src/linkml/${{ matrix.domain }} -name build.yaml -type f | grep -v '/begrepssamling-'); do
            if grep -q "^generators:" "$manifest" 2>/dev/null; then
              echo "→ Validerer skjema frå manifest: $manifest"
              bash src/assets/scripts/ci/run-validation.sh --manifest "$manifest" &
              PIDS+=($!)
              MANIFESTS+=("$manifest")
            fi
          done

          FAILED=0
          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              echo "::error file=${MANIFESTS[$i]}::Validering feila"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Validering feila for $FAILED manifest(ar) i ${{ matrix.domain }} — stoppar bygget"
            exit 1
          fi

          echo "✓ Validering fullført for ${{ matrix.domain }}"

      - name: Kopier valideringsloggar til generated/
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          echo "=== Kopierer valideringsloggar til generated/ ==="

          for schema_dir in src/linkml/${{ matrix.domain }}/*/; do
            if [ ! -d "$schema_dir/validation" ]; then
              continue
            fi

            schema_name=$(basename "$schema_dir")
            schema_file="$schema_dir/${schema_name}-schema.yaml"

            # Les versjon frå skjema
            if [ ! -f "$schema_file" ]; then
              echo "  ⚠️  $schema_name: Fann ikkje schema-fil, hoppar over" >&2
              continue
            fi

            version=$(python3 -c "import yaml; print(yaml.safe_load(open('$schema_file')).get('version', ''))" 2>/dev/null || echo "")

            if [ -z "$version" ] || [ "$version" = "None" ]; then
              echo "  ⚠️  $schema_name: Manglar version-felt, hoppar over" >&2
              continue
            fi

            # Sjekk om validerings-katalog for denne versjonen finst
            validation_version_dir="$schema_dir/validation/$version"
            if [ ! -d "$validation_version_dir" ]; then
              echo "  ⚠️  $schema_name: Ingen validering for versjon $version, hoppar over" >&2
              continue
            fi

            target_dir="generated/${{ matrix.domain }}/$schema_name/validation/$version"
            mkdir -p "$target_dir"
            if ! cp_output=$(cp -rv "$validation_version_dir"/* "$target_dir/" 2>&1); then
              echo "  ⚠️  $schema_name v$version: kopiering av valideringsloggar feila: $cp_output" >&2
            fi

            echo "  ✓ $schema_name v$version: $(find "$target_dir" -name '*.json' 2>/dev/null | wc -l) validerings-loggar kopierte"
          done

      - name: Generer alle artefaktar for ${{ matrix.domain }}
        if: steps.cache-generated.outputs.cache-hit != 'true'
        shell: bash
        env:
          LOGLVL: DEBUG
        run: |
          set -euo pipefail

          # Pre-flight: logg alle skjema som skal genererast
          echo "=== Skjema som skal genererast for ${{ matrix.domain }} ==="
          find src/linkml/${{ matrix.domain }} -name "*-schema.yaml" -type f | sort | while read schema; do
            echo "  - $schema"
          done
          echo ""

          # Køyr domene-target med retry-logikk for transiente podman-feil
          retry_count=0
          max_retries=2
          while [ $retry_count -le $max_retries ]; do
            if make domain-${{ matrix.domain }}; then
              echo "✓ make domain-${{ matrix.domain }} fullført"
              break
            else
              exit_code=$?
              retry_count=$((retry_count + 1))
              if [ $retry_count -le $max_retries ]; then
                echo "::warning::make domain-${{ matrix.domain }} feila (forsøk $retry_count/$max_retries) — ventar 10s før retry"
                sleep 10
              else
                echo "::error file=.github/workflows/generate.yml,line=239::make domain-${{ matrix.domain }} feila etter $max_retries retrys"
                exit $exit_code
              fi
            fi
          done

      - name: Logg genererte artefaktar før upload
        run: |
          echo "=== Genererte artefaktar for ${{ matrix.domain }} ==="
          if [ -d "generated/${{ matrix.domain }}" ]; then
            du -sh generated/${{ matrix.domain }}
            find generated/${{ matrix.domain }} -type f | wc -l | xargs echo "Antal filer:"
            echo ""
            echo "=== Struktur ==="
            tree -L 3 generated/${{ matrix.domain }} 2>/dev/null || find generated/${{ matrix.domain }} -type f | head -100
          else
            echo "⚠ generated/${{ matrix.domain }}/ finst ikkje!"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.domain }}
          path: generated/${{ matrix.domain }}/
          retention-days: 1

  publish:
    needs: [generate, checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Oppgrader crun
        uses: ./.github/actions/upgrade-crun

      - name: Last ned alle genererte artefaktar
        uses: actions/download-artifact@v8
        with:
          pattern: generated-*
          path: generated-merged/

      - name: Slå saman domene-artefaktar til generated/
        run: |
          mkdir -p generated/
          for domain in ${{ needs.checkout-source.outputs.domain_list }}; do
            if [ -d "generated-merged/generated-$domain" ]; then
              mv "generated-merged/generated-$domain" "generated/$domain"
            fi
          done

      - name: Logg inn på GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Last mkdocs-local image frå GHCR
        run: |
          GHCR_TAG="ghcr.io/${{ github.repository_owner }}/mkdocs-local:${{ hashFiles('src/assets/containers/Dockerfile.mkdocs') }}"
          echo "Lastar mkdocs-local frå GHCR: $GHCR_TAG"
          podman pull "$GHCR_TAG"
          podman tag "$GHCR_TAG" localhost/mkdocs-local:latest

      - name: Cache mkdocs-build-cache
        uses: actions/cache@v6
        with:
          path: mkdocs/.cache/
          key: mkdocs-build-${{ hashFiles('src/linkml/**', 'src/assets/containers/Dockerfile.mkdocs', 'src/assets/templates/**', 'mkdocs/docs/stylesheets/**', 'mkdocs/docs/javascripts/**', 'mkdocs/overrides/**') }}
          restore-keys: mkdocs-build-

      - name: Publiser og bygg dokumentasjonsportal
        shell: bash
        env:
          LOGLVL: DEBUG
        run: |
          set -euo pipefail
          trap 'echo "::error file=.github/workflows/generate.yml,line=326::make docs-publish/docs-build failed — sjå loggar for detaljar"; exit 1' ERR
          make docs-publish
          make docs-build

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Last opp Pages-artefakt
        uses: actions/upload-pages-artifact@v5
        with:
          path: mkdocs/site/

      - name: Deploy til GitHub Pages (forsøk 1)
        id: deploy-attempt-1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før retry (dersom forsøk 1 feila)
        if: steps.deploy-attempt-1.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment feila — ventar 30 sekund før retry..."
          sleep 30

      - name: Deploy til GitHub Pages (forsøk 2)
        id: deploy-attempt-2
        if: steps.deploy-attempt-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før siste retry (dersom forsøk 2 feila)
        if: steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment feila igjen — ventar 60 sekund før siste forsøk..."
          sleep 60

      - name: Deploy til GitHub Pages (forsøk 3 — siste)
        id: deploy
        if: steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
