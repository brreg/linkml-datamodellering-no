name: Generate and publish

# Tidlegare kjent race condition mot release-please.yml sin
# schema-versjons-oppdateringsjobb: denne workflowen kunne køyre to gonger
# per release (éin gong på data frå før versjonsoppdateringa, éin gong
# korrigert). `concurrency`-blokka under løyser dette — når det korrigerte
# løpet startar, vert det førre, no utdaterte løpet kansellert automatisk.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Negative mønster (!...) ekskluderer filer som er verifisert IKKJE i
    # kallgrafen til denne workflowen sine make-mål (make domain-*,
    # make docs-publish, make docs-build) — sjå
    # specs/done/generate-workflow-path-filtrering.md. Merk:
    # find-similar-names.py og make/91-modell-analyse.mk er IKKJE lenger
    # ekskludert — "generate"-jobben kallar dei no direkte for å generere
    # ## Modellanalyse-seksjonen per skjema (sjå
    # specs/done/modellanalyse-per-skjema-index-md.md). Dei attverande
    # ekskluderte filene er kun brukte av modell-analyse.yml (vekentleg,
    # nettverksavhengige IRI-sjekkar) eller scaffold-/migrerings-/PR-verktøy
    # som ikkje inngår i generate/publish-pipelinen.
    paths:
      - 'src/linkml/**'
      - 'src/assets/containers/**'
      - 'src/assets/templates/**'
      - 'src/assets/scripts/**'
      - '!src/assets/scripts/makefile/check-iri-resolution.py'
      - '!src/assets/scripts/migreringsscript/**'
      - '!src/assets/scripts/scaffolding/**'
      - '!src/assets/scripts/pr-linkml-interactive.bash'
      - 'make/**'
      - 'mkdocs/**'
      - 'README.md'
      - 'Makefile'

concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  checkout-source:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.discover.outputs.domains }}
      domain_list: ${{ steps.discover.outputs.domain_list }}
      images: ${{ steps.image-tags.outputs.images }}
      image_tags: ${{ steps.image-tags.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Oppdag domene
        id: discover
        uses: ./.github/actions/discover-domains
      - name: Bygg image-tag-oppslag
        id: image-tags
        uses: ./.github/actions/compute-image-tags
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            src/
            mkdocs/
            .github/
            Makefile
            make/
            README.md
            CODEOWNERS.md
          retention-days: 1
          include-hidden-files: true

  ensure-images:
    name: "build-image / ${{ matrix.image.name }}"
    needs: [checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      # Image-lista kjem frå src/assets/containers/images.json (autoritativ
      # kjelde, lasta via checkout-source sitt image-tags-steg) — ikkje
      # hardkoda her lenger.
      matrix:
        image: ${{ fromJson(needs.checkout-source.outputs.images) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Logg artifact-innhald og miljøinfo
        run: |
          echo "=== Artifact-innhald etter download ==="
          ls -lah src/assets/containers/ 2>/dev/null || echo "src/assets/containers/ finst ikkje"
          ls -lah ${{ matrix.image.dockerfile }} 2>/dev/null || echo "${{ matrix.image.dockerfile }} finst ikkje"
          echo ""
          echo "=== Disk-bruk ==="
          df -h
          echo ""
          echo "=== Versjonsinformasjon ==="
          echo "podman: $(podman --version)"
          echo "crun: $(crun --version | head -1)"
          echo "skopeo: $(skopeo --version)"

      - name: Oppgrader crun
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sikre ${{ matrix.image.name }} i GHCR
        uses: ./.github/actions/ensure-image
        with:
          name: ${{ matrix.image.name }}
          tag: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ fromJson(needs.checkout-source.outputs.image_tags)[matrix.image.name] }}
          make_target: ${{ matrix.image.make_target }}

  modellanalyse-tvers-domene:
    # Eiga jobb (i staden for eit steg i `publish`) slik at dei ~30-40 s
    # dette steget tok tidlegare no overlappar med `generate`-matrisa i
    # staden for å leggje seg attpå henne — `find-similar-names.py --scope
    # all` les berre kjeldeskjemaa i `src/linkml/` (frå `source`-artefaktet),
    # ikkje noko frå `generate`-matrisa sin `generated/`-output, så det finst
    # ingen reell avhengigheit som tvingar denne til å vente på matrisa. Sjå
    # specs/done/effektiviser-modellanalyse-koyretid.md (Tiltak 5-oppfølging,
    # parallelliser mot heile `generate`-matrisa i staden for berre internt
    # i `publish`-jobben).
    needs: [ensure-images, checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Cache modellanalyse på tvers av domene
        # Nøkla på heile src/linkml/** (ikkje domene-scopa) sidan --scope
        # all les alle skjema i repoet — denne jobben har difor IKKJE det
        # kryss-domene-import-hòlet domene-scopa cache i generate/
        # valider-og-analyser-jobbane har (sjå
        # specs/done/cache-valider-og-analyser-modellanalyse.md). "infra"-
        # delen listar EKSPLISITT dei filene som faktisk er i kallgrafen til
        # `make analyse-similar-alle-domene-batch` (verifisert med grep):
        # find-similar-names.py sjølv, make/91-modell-analyse.mk (målet),
        # make/00-settings.mk (print_header/LOGLVL), make/01-containers.mk
        # (PYTHON_RUN — einaste kontaineren målet brukar),
        # Dockerfile.python (python-pytest-imaget), make/80-images.mk
        # (.github/actions/pull-images fell tilbake til `make <target>`
        # ved GHCR-pull-feil) og Makefile (include-rot).
        id: cache-modellanalyse-tvers
        uses: actions/cache@v6
        with:
          path: generated/modell-analyse-tvers-domene/
          key: v1-modellanalyse-tvers-domene-${{ hashFiles('src/linkml/**') }}-infra-${{ hashFiles('src/assets/scripts/makefile/find-similar-names.py', 'src/assets/containers/Dockerfile.python', 'make/00-settings.mk', 'make/01-containers.mk', 'make/80-images.mk', 'make/91-modell-analyse.mk', 'Makefile') }}

      - name: Oppgrader crun
        if: steps.cache-modellanalyse-tvers.outputs.cache-hit != 'true'
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        if: steps.cache-modellanalyse-tvers.outputs.cache-hit != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Last python-pytest frå GHCR
        if: steps.cache-modellanalyse-tvers.outputs.cache-hit != 'true'
        uses: ./.github/actions/pull-images
        with:
          images: '[{"name":"python-pytest","make_target":"build-docker-python"}]'
          image_tags: ${{ needs.checkout-source.outputs.image_tags }}

      - name: Køyr modellanalyse på tvers av domene
        if: steps.cache-modellanalyse-tvers.outputs.cache-hit != 'true'
        # --scope all samanliknar på tvers av heile repoet, så treng berre
        # køyrast éin gong (ikkje per domene/skjema). Skriv til ein fast,
        # ikkje-domene-scopa katalog som mkdocs/publish.sh publiserer som
        # faste sider under mkdocs/docs/modellanalyse/ — sjå
        # specs/backlog/modellanalyse-ubrukte-lokale-definisjonar.md. Eitt
        # batch-kall (alle tre kindar i éin prosess) — sjå
        # specs/done/effektiviser-modellanalyse-koyretid.md. Ikkje
        # -e: ein feil her skal ikkje stoppe resten av workflowen — dette er
        # ein informativ rapport, ikkje ei blokkerande sjekk (same prinsipp
        # som modell-analyse.yml).
        run: |
          set -uo pipefail
          echo "=== Køyrer modellanalyse på tvers av domene ==="

          if make analyse-similar-alle-domene-batch OUT_DIR=generated/modell-analyse-tvers-domene; then
            echo "✓ Modellanalyse på tvers av domene fullført"
          else
            echo "::warning::analyse-similar-alle-domene-batch feila"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: generated-modell-analyse-tvers-domene
          path: generated/modell-analyse-tvers-domene/
          retention-days: 1

  valider-og-analyser:
    name: "valider-og-analyser / ${{ matrix.domain }}"
    # Domene-intern validering + modellanalyse, flytta ut av `generate`-
    # jobben til si eiga jobb (same domene-matrise, same startpunkt) slik
    # at dei ~35 s dei til saman tok som eit sekvensielt for-steg framfor
    # "Generer alle artefakter" no i staden overlappar med den (fleire
    # minutt lange) artefaktgenereringa der.
    # Validering er ei hard byggjesperre (exit 1 ved feil) — `publish`
    # sin needs-graf blokkerer heile bygget dersom denne jobben feilar
    # for noko domene (ei matrise-jobb er éi logisk eining i needs-grafen,
    # inga ekstra logikk trengst) — sjå
    # specs/done/splitt-validering-modellanalyse-eigen-jobb.md.
    # Cacha (jf. Cache-steget under) sidan denne planen sitt vedtak om å
    # ikkje cache vart reversert — sjå
    # specs/done/cache-valider-og-analyser-modellanalyse.md.
    needs: [ensure-images, checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        domain: ${{ fromJson(needs.checkout-source.outputs.domains) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Cache validering og modellanalyse (${{ matrix.domain }})
        # Domene-scopa kjeldehash, same avgrensing (og same kjende
        # kryss-domene-import-hòl) som `generate`-jobben sin cache — sjå
        # kommentaren der (linje ~421-437) og
        # specs/done/cache-valider-og-analyser-modellanalyse.md. "infra"-
        # delen listar EKSPLISITT dei filene som faktisk er i kallgrafen
        # til stega under (verifisert med grep):
        # - run-validation.sh kallar flatten-and-validate.bash direkte via
        #   `bash` (ingen `make`-kall i denne kallgrafen — difor er
        #   make/40-validation.mk IKKJE relevant her, i motsetnad til i
        #   generate-jobben sin `make validate`-bruk)
        # - flatten-and-validate.bash monterer server.py og heile
        #   policies/-katalogen inn i mcp-linkml-validator-kontaineren
        # - validation_log.py (delt loggstruktur, BUG-12)
        # - dei to analyse-*-domene-batch-måla → make/91-modell-analyse.mk,
        #   PYTHON_RUN/LINKML_RUN frå make/01-containers.mk,
        #   print_header/LOGLVL frå make/00-settings.mk
        # - find-unused-local-definitions.py (LINKML_RUN) importerer i
        #   tillegg linkml_relative_import_patch.py — utan denne i "infra"-
        #   hashen ville ei retting der (t.d. av BUG-x i bugs/) gitt eit
        #   stille cache-hit i staden for reell re-køyring
        # - dei tre statisk pulla images sine Dockerfile
        # - make/80-images.mk (pull-images fell tilbake til `make <target>`
        #   ved GHCR-pull-feil)
        id: cache-valider
        uses: actions/cache@v6
        with:
          path: generated/${{ matrix.domain }}/
          key: v1-valider-og-analyser-${{ matrix.domain }}-${{ hashFiles(format('src/linkml/{0}/**', matrix.domain)) }}-infra-${{ hashFiles('src/assets/scripts/makefile/run-validation.sh', 'src/assets/scripts/makefile/find-similar-names.py', 'src/assets/scripts/makefile/find-unused-local-definitions.py', 'src/assets/scripts/utils/validation_log.py', 'src/assets/scripts/utils/linkml_relative_import_patch.py', 'src/mcp-linkml-validator/flatten-and-validate.bash', 'src/mcp-linkml-validator/server.py', 'src/mcp-linkml-validator/policies/**', 'src/assets/containers/Dockerfile.linkml', 'src/assets/containers/Dockerfile.mcp-linkml', 'src/assets/containers/Dockerfile.python', 'make/00-settings.mk', 'make/01-containers.mk', 'make/80-images.mk', 'make/91-modell-analyse.mk', 'Makefile') }}

      - name: Oppgrader crun
        if: steps.cache-valider.outputs.cache-hit != 'true'
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        if: steps.cache-valider.outputs.cache-hit != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Last images inn i podman frå GHCR
        if: steps.cache-valider.outputs.cache-hit != 'true'
        # Statisk liste — linkml-local/python-pytest/mcp-linkml-validator
        # er alt always_required i images.json (validering+modellanalyse
        # sine einaste avhengigheiter, uavhengig av domenet sine
        # generator-flagg) — treng difor ikkje detect-required-images
        # (som er laga for gen-domain sine valfrie generator-avhengige image).
        uses: ./.github/actions/pull-images
        with:
          images: '[{"name":"linkml-local","make_target":"build-docker-linkml"},{"name":"python-pytest","make_target":"build-docker-python"},{"name":"mcp-linkml-validator","make_target":"build-docker-mcp-validator"}]'
          image_tags: ${{ needs.checkout-source.outputs.image_tags }}

      - name: Valider alle skjema for ${{ matrix.domain }}
        if: steps.cache-valider.outputs.cache-hit != 'true'
        # Einaste kontrollen mot innhaldet ETTER release-please sin
        # [skip ci]-versjonsbump (sjå release-please.yml, steget "Oppdater
        # schema-versjonar i release-PR") — validate.yml validerer aldri
        # denne konkrete, versjonsoppdaterte skjema-tilstanden før merge,
        # sidan den bump-commiten går rett til PR-branchen med [skip ci].
        # Feilar difor bygget ved reell valideringsfeil i staden for å
        # svelgje feilkoden — sjå ikkje på dette som dobbeltarbeid og fjern
        # det ikkje utan å løyse [skip ci]-gapet på annan måte fyrst.
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Validerer skjema for ${{ matrix.domain }} ==="

          # Køyr validering for alle build.yaml med generators:-blokk, parallelt.
          # Kvart run-validation.sh-kall flatar ut og validerer berre sitt eige
          # skjema (unik mktemp-fil, unik loggsti) — heilt isolert frå andre
          # skjema sin køyring, så parallellisering av løkka er trygt. Same
          # &-/PIDS-/wait-mønster som mkdocs/publish.sh (Steg 2) brukar for
          # parallell skjemagenerering.
          # Ekskluder begrepssamling-* (same filter som validate.yml sin
          # validate-jobb) — desse er konseptsamlingar utan skjemafil, sjølv
          # om build.yaml deira har eit generators:-avsnitt (alle flagg
          # false); utan filteret feilar run-validation.sh alltid med
          # "Fann ingen *-schema.yaml".
          declare -a PIDS=()
          declare -a MANIFESTS=()
          for manifest in $(find src/linkml/${{ matrix.domain }} -name build.yaml -type f | grep -v '/begrepssamling-'); do
            if grep -q "^generators:" "$manifest" 2>/dev/null; then
              (
                start=$(date +%s%3N)
                rc=0
                log_path=$(bash src/assets/scripts/makefile/run-validation.sh --manifest "$manifest" --quiet) || rc=$?
                elapsed=$(( $(date +%s%3N) - start ))
                # Kort visningssti (utan "src/linkml/<domain>/"-prefiks) — sjå
                # specs/done/kort-validering-logglinje.md.
                model=$(basename "$(dirname "$manifest")")
                schema_short="$model/$model-schema.yaml"
                log_short="$model/${log_path#*/"$model"/}"
                if [ $rc -eq 0 ]; then
                  printf "✓ Validert %s → %s (%d.%ds)\n" "$schema_short" "$log_short" $((elapsed / 1000)) $((elapsed % 1000 / 100))
                else
                  printf "✗ Validering feila for %s → %s (%d.%ds)\n" "$schema_short" "$log_short" $((elapsed / 1000)) $((elapsed % 1000 / 100))
                fi
                exit $rc
              ) &
              PIDS+=($!)
              MANIFESTS+=("$manifest")
            fi
          done

          FAILED=0
          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              echo "::error file=${MANIFESTS[$i]}::Validering feila"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Validering feila for $FAILED manifest(ar) i ${{ matrix.domain }} — stoppar bygget"
            exit 1
          fi

          echo "✓ Validering fullført for ${{ matrix.domain }}"

      - name: Kopier valideringsloggar til generated/
        if: steps.cache-valider.outputs.cache-hit != 'true'
        run: |
          echo "=== Kopierer valideringsloggar til generated/ ==="

          for schema_dir in src/linkml/${{ matrix.domain }}/*/; do
            if [ ! -d "$schema_dir/validation" ]; then
              continue
            fi

            schema_name=$(basename "$schema_dir")
            schema_file="$schema_dir/${schema_name}-schema.yaml"

            # Les versjon frå skjema
            if [ ! -f "$schema_file" ]; then
              echo "  ⚠️  $schema_name: Fann ikkje schema-fil, hoppar over" >&2
              continue
            fi

            # Enkelt grep/sed-oppslag (ikkje python3/PyYAML) — version-feltet er
            # alltid ein enkel skalarverdi (sitert eller usitert), aldri ei
            # fleirlinje-YAML-verdi, jf. CONVENTIONS.md sitt semver-krav.
            version=$(grep -m1 '^version:' "$schema_file" | sed -E 's/^version:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/' || echo "")

            if [ -z "$version" ] || [ "$version" = "None" ]; then
              echo "  ⚠️  $schema_name: Manglar version-felt, hoppar over" >&2
              continue
            fi

            # Sjekk om validerings-katalog for denne versjonen finst
            validation_version_dir="$schema_dir/validation/$version"
            if [ ! -d "$validation_version_dir" ]; then
              echo "  ⚠️  $schema_name: Ingen validering for versjon $version, hoppar over" >&2
              continue
            fi

            target_dir="generated/${{ matrix.domain }}/$schema_name/validation/$version"
            mkdir -p "$target_dir"
            if ! cp_output=$(cp -rv "$validation_version_dir"/* "$target_dir/" 2>&1); then
              echo "  ⚠️  $schema_name v$version: kopiering av valideringsloggar feila: $cp_output" >&2
            fi

            echo "  ✓ $schema_name v$version: $(find "$target_dir" -name '*.json' 2>/dev/null | wc -l) validerings-loggar kopierte"
          done

      - name: Køyr modellanalyse per skjema for ${{ matrix.domain }}
        if: steps.cache-valider.outputs.cache-hit != 'true'
        # Domene-scopa (ikkje cross-domain, ikkje nettverksavhengige
        # IRI-sjekkar) — sjå specs/done/modellanalyse-per-skjema-index-md.md
        # for grunngjeving. To batch-kall (éin LINKML_RUN, éin PYTHON_RUN,
        # køyrde parallelt via &/wait) i staden for opptil 8×N sekvensielle
        # `make`-kall (eitt per skjema × sjekk) — kvart kontainarkall betalte
        # linkml-import-skatten (~1-2 s) på nytt, og
        # analyse-similar-*-domain re-parsa i tillegg ALLE skjema i domenet
        # for kvart kall (O(3N²) yaml-parsingar). Sjå
        # specs/done/effektiviser-modellanalyse-koyretid.md. Ingen -e: éin
        # skjemafeil skal ikkje stoppe resten — dette er ein informativ
        # rapport, ikkje ei blokkerande sjekk (same prinsipp som
        # modell-analyse.yml). Begge batch-scripta handterer per-skjema-feil
        # internt (loggar og held fram), så desse to kalla feilar berre ved
        # meir fundamentale problem (t.d. manglande kontainarbilete).
        run: |
          set -uo pipefail
          echo "=== Køyrer modellanalyse per skjema for ${{ matrix.domain }} ==="

          make analyse-similar-domene-batch DOMAIN=${{ matrix.domain }} &
          pid_similar=$!

          make analyse-lokal-modellanalyse-domene DOMAIN=${{ matrix.domain }} &
          pid_lokal=$!

          failed=0
          wait "$pid_similar" || { echo "::warning::analyse-similar-domene-batch feila for ${{ matrix.domain }}"; failed=1; }
          wait "$pid_lokal" || { echo "::warning::analyse-lokal-modellanalyse-domene feila for ${{ matrix.domain }}"; failed=1; }

          if [ "$failed" -eq 0 ]; then
            echo "✓ Modellanalyse fullført for ${{ matrix.domain }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.domain }}-checks
          path: generated/${{ matrix.domain }}/
          retention-days: 1

  generate:
    name: "generate / ${{ matrix.domain }}"
    needs: [ensure-images, checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
      packages: read
    strategy:
      matrix:
        domain: ${{ fromJson(needs.checkout-source.outputs.domains) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Logg artifact-innhald (${{ matrix.domain }})
        run: |
          echo "=== Artifact-innhald etter download ==="
          ls -lah src/linkml/${{ matrix.domain }}/ 2>/dev/null || echo "src/linkml/${{ matrix.domain }}/ finst ikkje"
          echo ""
          echo "=== Skjema i domenet ==="
          find src/linkml/${{ matrix.domain }} -name "*-schema.yaml" 2>/dev/null || echo "Ingen skjema funne"
          echo ""
          echo "=== Disk-bruk ==="
          df -h

      - name: Cache genererte artefakter (${{ matrix.domain }})
        id: cache-generated
        uses: actions/cache@v6
        with:
          path: generated/${{ matrix.domain }}/
          # "infra"-delen listar EKSPLISITT dei .mk-filene som faktisk er i
          # kallgrafen til `make domain-<domain>` (verifisert med grep — sjå
          # specs/done/docs-only-endring-cache-miss-alle-domene.md), i staden
          # for det breie `make/**` som tidlegare invaliderte cachen for ALLE
          # domene ved reine docs-/mcp-/scaffolding-/tools-endringar (t.d.
          # make/50-docs.mk). `make/80-images.mk` er med sidan
          # .github/actions/pull-images fell tilbake til `make <target>`
          # derifrå når ein GHCR-pull feilar. `make/40-validation.mk` er med
          # sidan `run-domain-pipeline.sh` sin Fase 1 kallar `make validate`
          # (grunnleggjande LinkML-import-sjekk — IKKJE den same som
          # policy-valideringa `valider-og-analyser`-jobben gjer, sjå
          # specs/done/splitt-validering-modellanalyse-eigen-jobb.md).
          # `make/91-modell-analyse.mk` er IKKJE lenger med her — den
          # domene-scopa modellanalysen som brukte target derifrå er flytta
          # til `valider-og-analyser`-jobben (uncacha der). `make/50-docs.mk`,
          # `make/60-mcp.mk`, `make/70-scaffolding.mk` og `make/90-tools.mk`
          # er framleis medvite utelatne — verifisert ikkje i kallgrafen.
          # `src/assets/scripts/`-delen er tilsvarande innsnevra frå det
          # breie `src/assets/scripts/**` (som gav same feilklasse — sjå
          # specs/done/scripts-glob-cache-miss-generate-jobb.md) til dei
          # EKSPLISITT grep-verifiserte delane av kallgrafen:
          # `makefile/**` (batch-generate*.py, run-domain-pipeline.sh,
          # batch-render-plantuml.sh, batch-gen-xsd.sh,
          # batch-asyncapi-validate.sh, batch-lint.py,
          # batch-linkml-validate.py, check-import-duplicates.py,
          # detect-validation-policy.py, run-schema-validation.py,
          # save-validation-log.py, run-validation.sh,
          # filter_container.awk), `scaffolding/resolve-catalog-slug.sh`
          # (einaste scaffolding-fila i kallgrafen, brukt av
          # make/30-instances.mk) og `utils/**` (importert transitivt av
          # fleire `makefile/*.py`-skript: linkml_relative_import_patch.py,
          # schema_meta.py, release_helpers.py, validation_log.py,
          # codeowners.py). `demo/`, `migreringsscript/`, resten av
          # `scaffolding/` og `container/` (kun brukt via COPY i
          # Dockerfile.asyncapi-cli-minimal, som får ny image-tag via
          # compute-image-tags uavhengig av denne cachen) er medvite
          # utelatne — verifisert ikkje i kallgrafen.
          key: v4-generated-${{ matrix.domain }}-${{ hashFiles(format('src/linkml/{0}/**', matrix.domain)) }}-infra-${{ hashFiles('src/assets/containers/Dockerfile.linkml', 'src/assets/containers/Dockerfile.avrotize', 'src/assets/containers/Dockerfile.asyncapi-cli-minimal', 'src/assets/scripts/makefile/**', 'src/assets/scripts/scaffolding/resolve-catalog-slug.sh', 'src/assets/scripts/utils/**', 'src/assets/templates/**', 'make/00-settings.mk', 'make/01-containers.mk', 'make/02-schema-discovery.mk', 'make/03-output.mk', 'make/10-generator-macros.mk', 'make/11-generator-targets.mk', 'make/20-domain-targets.mk', 'make/30-instances.mk', 'make/40-validation.mk', 'make/80-images.mk', 'Makefile') }}

      - name: Oppgrader crun
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detekter påkrevde images for ${{ matrix.domain }}
        if: steps.cache-generated.outputs.cache-hit != 'true'
        id: detect-images
        uses: ./.github/actions/detect-required-images
        with:
          domain: ${{ matrix.domain }}

      - name: Last images inn i podman frå GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/pull-images
        with:
          images: ${{ steps.detect-images.outputs.images }}
          image_tags: ${{ needs.checkout-source.outputs.image_tags }}

      - name: Generer alle artefakter for ${{ matrix.domain }}
        if: steps.cache-generated.outputs.cache-hit != 'true'
        uses: ./.github/actions/generate-domain
        with:
          domain: ${{ matrix.domain }}

      - name: Logg genererte artefakter før upload
        run: |
          echo "=== Genererte artefakter for ${{ matrix.domain }} ==="
          if [ -d "generated/${{ matrix.domain }}" ]; then
            du -sh generated/${{ matrix.domain }}
            find generated/${{ matrix.domain }} -type f | wc -l | xargs echo "Antal filer:"
            echo ""
            echo "=== Struktur ==="
            tree -L 3 generated/${{ matrix.domain }} 2>/dev/null || find generated/${{ matrix.domain }} -type f | head -100
          else
            echo "⚠ generated/${{ matrix.domain }}/ finst ikkje!"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.domain }}
          path: generated/${{ matrix.domain }}/
          retention-days: 1

  publish:
    needs: [generate, valider-og-analyser, checkout-source, modellanalyse-tvers-domene]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Slå saman genererte domene-artefakt til generated/
        uses: ./.github/actions/merge-generated-artifacts
        with:
          domain_list: ${{ needs.checkout-source.outputs.domain_list }}

      - name: Last ned modellanalyse-tvers-domene-artefakt
        # Produsert av den parallelle modellanalyse-tvers-domene-jobben
        # (køyrde samstundes med generate-matrisa, ikkje etterpå) — sjå
        # specs/done/effektiviser-modellanalyse-koyretid.md.
        uses: actions/download-artifact@v8
        with:
          name: generated-modell-analyse-tvers-domene
          path: generated/modell-analyse-tvers-domene/

      - name: Cache bygd site (mkdocs/site/)
        id: cache-site
        # Cachar det FERDIGBYGDE portal-resultatet (i staden for det
        # verknadslause forsøket via mkdocs-build-cache-plugin, sjå
        # specs/done/raskare-docs-build.md) — nøkla på INNDATAA som
        # avgjer det renderte innhaldet (generated/, publish.sh-
        # orkestreringa, statiske mkdocs-sider/tema, README.md), ikkje på
        # OUTPUT-katalogen. mkdocs/publish.sh skriv eit ferskt
        # "sist bygd"-tidsstempel inn i portalen kvar køyring, så eit
        # output-hasha nøkkel ville aldri treffe — det var nett grunnen
        # den gamle pluginen aldri fungerte. Denne workflowen sin
        # `on.push.paths`-filter dekkjer ikkje `.github/workflows/**`, så
        # reine CI-/workflow-tuning-køyringar (via workflow_dispatch) har
        # typisk INGEN endring i desse inndataa og kan hoppe rett til
        # deploy. Sjå specs/backlog/reduser-generate-workflow-under-5min.md
        # (Tiltak 1) for grunngjeving og full inndata-kartlegging.
        uses: actions/cache@v6
        with:
          path: mkdocs/site/
          key: v1-site-${{ hashFiles('generated/**', 'mkdocs/publish.sh', 'mkdocs/lib/**', 'mkdocs/docs/**', 'mkdocs/overrides/**', 'src/assets/containers/Dockerfile.mkdocs', 'README.md', 'src/assets/scripts/makefile/generate-readme-tables.sh', 'src/mcp-linkml-validator/policies/README.md') }}

      - name: Oppgrader crun
        if: steps.cache-site.outputs.cache-hit != 'true'
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        if: steps.cache-site.outputs.cache-hit != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Last mkdocs-local og python-pytest frå GHCR (parallelt)
        # mkdocs/publish.sh (via mkdocs/lib/utils/python_container.sh) køyrer
        # YAML-oppslag i python-pytest-kontaineren i staden for python3
        # direkte på runneren — sjå
        # specs/done/nye-host-python-kall-batching.md (Funn 3). Same
        # ./.github/actions/pull-images-action og image_tags-kjelde
        # (checkout-source) som resten av workflowen brukar — sjå
        # specs/backlog/parallell-image-pull-publish-jobb.md.
        if: steps.cache-site.outputs.cache-hit != 'true'
        uses: ./.github/actions/pull-images
        with:
          images: '[{"name":"mkdocs-local","make_target":"build-docker-mkdocs"},{"name":"python-pytest","make_target":"build-docker-python"}]'
          image_tags: ${{ needs.checkout-source.outputs.image_tags }}

      - name: Publiser og bygg dokumentasjonsportal
        if: steps.cache-site.outputs.cache-hit != 'true'
        shell: bash
        env:
          LOGLVL: DEBUG
        run: |
          set -euo pipefail
          trap 'echo "::error file=.github/workflows/generate.yml,line=326::make docs-publish/docs-build failed — sjå loggar for detaljar"; exit 1' ERR
          make docs-publish
          make docs-build

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Last opp Pages-artefakt
        uses: actions/upload-pages-artifact@v5
        with:
          path: mkdocs/site/

      - name: Deploy til GitHub Pages (forsøk 1)
        id: deploy-attempt-1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før retry (dersom forsøk 1 feila)
        if: steps.deploy-attempt-1.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment feila — ventar 30 sekund før retry..."
          sleep 30

      - name: Deploy til GitHub Pages (forsøk 2)
        id: deploy-attempt-2
        if: steps.deploy-attempt-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før siste retry (dersom forsøk 2 feila)
        if: steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment feila igjen — ventar 60 sekund før siste forsøk..."
          sleep 60

      - name: Deploy til GitHub Pages (forsøk 3 — siste)
        id: deploy
        if: steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
