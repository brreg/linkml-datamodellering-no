name: Generate and publish

# Kjent, akseptert race condition mot release-please.yml sin update-dates-
# jobb (kommentert der) — denne workflowen kan derfor køyre to gonger per
# release (éin gong på data frå før update-dates, éin gong korrigert).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/linkml/**'
      - 'src/assets/containers/**'
      - 'src/assets/templates/**'
      - 'src/assets/scripts/**'
      - 'mkdocs/**'
      - 'README.md'
      - 'Makefile'


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  checkout-source:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            src/
            mkdocs/
            .github/
            Makefile
            README.md
            CODEOWNERS.md
          retention-days: 1
          include-hidden-files: true

  ensure-images:
    name: "build-image / ${{ matrix.image.name }}"
    needs: [checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: linkml-local
            dockerfile: src/assets/containers/Dockerfile.linkml
            make_target: build-docker-linkml
            hash_files: src/assets/containers/Dockerfile.linkml
          - name: python-pytest
            dockerfile: src/assets/containers/Dockerfile.python
            make_target: build-docker-python
            hash_files: |
              src/assets/containers/Dockerfile.python
              src/assets/containers/requirements-python-test.txt
          - name: avrotize-local
            dockerfile: src/assets/containers/Dockerfile.avrotize
            make_target: build-docker-avrotize
            hash_files: src/assets/containers/Dockerfile.avrotize
          - name: asyncapi-cli-local
            dockerfile: src/assets/containers/Dockerfile.asyncapi-cli
            make_target: build-docker-asyncapi
            hash_files: src/assets/containers/Dockerfile.asyncapi-cli
          - name: plantuml
            dockerfile: src/assets/containers/Dockerfile.plantuml
            make_target: build-docker-plantuml
            hash_files: src/assets/containers/Dockerfile.plantuml
          - name: mkdocs-local
            dockerfile: src/assets/containers/Dockerfile.mkdocs
            make_target: build-docker-mkdocs
            hash_files: src/assets/containers/Dockerfile.mkdocs
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Logg artifact-innhald og miljøinfo
        run: |
          echo "=== Artifact-innhald etter download ==="
          ls -lah src/assets/containers/ 2>/dev/null || echo "src/assets/containers/ finst ikkje"
          ls -lah ${{ matrix.image.dockerfile }} 2>/dev/null || echo "${{ matrix.image.dockerfile }} finst ikkje"
          echo ""
          echo "=== Disk-bruk ==="
          df -h
          echo ""
          echo "=== Versjonsinformasjon ==="
          echo "podman: $(podman --version)"
          echo "crun: $(crun --version | head -1)"
          echo "skopeo: $(skopeo --version)"

      - name: Oppgrader crun til støtte for OCI v1-image
        run: |
          echo "=== Oppgraderer crun frå $(crun --version | head -1) ==="
          CRUN_VERSION=1.18.2
          wget -q https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64 -O /tmp/crun
          chmod +x /tmp/crun
          sudo mv /tmp/crun /usr/bin/crun
          echo "=== Ny versjon: $(crun --version | head -1) ==="

      - name: Logg inn på GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sjekk om ${{ matrix.image.name }} finst i GHCR
        id: ghcr-check
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ hashFiles(matrix.image.hash_files) }}
          echo "=== Sjekkar GHCR for $IMAGE ==="
          if skopeo inspect --format='exists' docker://"$IMAGE" 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ Image finst i GHCR"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✗ Image finst ikkje — må byggje lokalt"
          fi

      - name: Bygg ${{ matrix.image.name }} image
        if: steps.ghcr-check.outputs.exists != 'true'
        run: |
          echo "=== Byggjer ${{ matrix.image.name }} ==="
          echo "Dockerfile: ${{ matrix.image.dockerfile }}"
          echo "Make target: ${{ matrix.image.make_target }}"
          set -x
          make ${{ matrix.image.make_target }}
          set +x
          echo "=== Image bygd — inspekterer lokalt image ==="
          podman inspect localhost/${{ matrix.image.name }}:latest | head -50

      - name: Push ${{ matrix.image.name }} til GHCR
        if: steps.ghcr-check.outputs.exists != 'true'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ hashFiles(matrix.image.hash_files) }}
          echo "=== Pushar til GHCR: $IMAGE ==="
          podman tag localhost/${{ matrix.image.name }}:latest "$IMAGE"
          podman push "$IMAGE"
          echo "✓ Push fullført"

  generate:
    name: "generate / ${{ matrix.domain }}"
    needs: [ensure-images]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
      packages: read
    strategy:
      matrix:
        domain: [ap-no, begrepskatalog, fair, fint, modellkatalog, ngr, oreg, samt]
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Logg artifact-innhald (${{ matrix.domain }})
        run: |
          echo "=== Artifact-innhald etter download ==="
          ls -lah src/linkml/${{ matrix.domain }}/ 2>/dev/null || echo "src/linkml/${{ matrix.domain }}/ finst ikkje"
          echo ""
          echo "=== Skjema i domenet ==="
          find src/linkml/${{ matrix.domain }} -name "*-schema.yaml" 2>/dev/null || echo "Ingen skjema funne"
          echo ""
          echo "=== Disk-bruk ==="
          df -h

      - name: Oppgrader crun til støtte for OCI v1-image
        run: |
          echo "=== Oppgraderer crun ==="
          CRUN_VERSION=1.18.2
          wget -q https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64 -O /tmp/crun
          chmod +x /tmp/crun
          sudo mv /tmp/crun /usr/bin/crun
          echo "=== Ny versjon: $(crun --version | head -1) ==="

      - name: Cache genererte artefaktar (${{ matrix.domain }})
        id: cache-generated
        uses: actions/cache@v6
        with:
          path: generated/${{ matrix.domain }}/
          key: v3-generated-${{ matrix.domain }}-${{ hashFiles(format('src/linkml/{0}/**', matrix.domain)) }}-infra-${{ hashFiles('src/assets/containers/Dockerfile.linkml', 'src/assets/containers/Dockerfile.avrotize', 'src/assets/containers/Dockerfile.asyncapi-cli', 'src/assets/templates/**', 'Makefile') }}

      - name: Logg inn på GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Last images inn i podman frå GHCR
        if: steps.cache-generated.outputs.cache-hit != 'true'
        run: |
          echo "=== Pullar images frå GHCR (parallelt) ==="
          pull_image() {
            local local_tag="$1" ghcr_tag="$2" make_target="$3"
            local start=$(date +%s%3N)
            echo "→ Prøver å pulle $ghcr_tag"
            if podman pull "$ghcr_tag" 2>&1; then
              podman tag "$ghcr_tag" "$local_tag"
              local elapsed=$(( $(date +%s%3N) - start ))
              printf "✓ Henta %s frå GHCR (%d.%ds)\n" "$local_tag" $((elapsed / 1000)) $((elapsed % 1000 / 100))
              echo "  Inspekterer image:"
              podman inspect "$local_tag" | grep -E "ManifestType|Created" | head -5
            else
              echo "⚠ GHCR-pull feila for $local_tag — byggjer lokalt"
              set -x
              make "$make_target"
              set +x
            fi
          }
          pull_image localhost/linkml-local:latest \
            "ghcr.io/${{ github.repository_owner }}/linkml-local:${{ hashFiles('src/assets/containers/Dockerfile.linkml') }}" \
            build-docker-linkml &
          pull_image localhost/python-pytest:latest \
            "ghcr.io/${{ github.repository_owner }}/python-pytest:${{ hashFiles('src/assets/containers/Dockerfile.python', 'src/assets/containers/requirements-python-test.txt') }}" \
            build-docker-python &
          pull_image localhost/avrotize-local:latest \
            "ghcr.io/${{ github.repository_owner }}/avrotize-local:${{ hashFiles('src/assets/containers/Dockerfile.avrotize') }}" \
            build-docker-avrotize &
          pull_image localhost/asyncapi-cli-local:latest \
            "ghcr.io/${{ github.repository_owner }}/asyncapi-cli-local:${{ hashFiles('src/assets/containers/Dockerfile.asyncapi-cli') }}" \
            build-docker-asyncapi &
          pull_image localhost/plantuml:latest \
            "ghcr.io/${{ github.repository_owner }}/plantuml:${{ hashFiles('src/assets/containers/Dockerfile.plantuml') }}" \
            build-docker-plantuml &
          wait
          echo "=== Alle pull-jobbar fullførte ==="
          echo "Lokale images:"
          podman images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.Created}}" | grep -E "localhost/(linkml-local|python-pytest|avrotize-local|asyncapi-cli-local|plantuml)" || echo "Ingen images funne"

      - name: Generer alle artefaktar for ${{ matrix.domain }}
        if: steps.cache-generated.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Køyr domene-target som genererer alle hovudartefaktar
          make domain-${{ matrix.domain }}

      - name: Logg genererte artefaktar før upload
        run: |
          echo "=== Genererte artefaktar for ${{ matrix.domain }} ==="
          if [ -d "generated/${{ matrix.domain }}" ]; then
            du -sh generated/${{ matrix.domain }}
            find generated/${{ matrix.domain }} -type f | wc -l | xargs echo "Antal filer:"
            echo ""
            echo "=== Struktur (første 50 linjer) ==="
            tree -L 3 generated/${{ matrix.domain }} 2>/dev/null | head -50 || find generated/${{ matrix.domain }} -type f | head -20
          else
            echo "⚠ generated/${{ matrix.domain }}/ finst ikkje!"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.domain }}
          path: generated/${{ matrix.domain }}/
          retention-days: 1

  publish:
    needs: [generate]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: .

      - name: Oppgrader crun til støtte for OCI v1-image
        run: |
          CRUN_VERSION=1.18.2
          wget -q https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64 -O /tmp/crun
          chmod +x /tmp/crun
          sudo mv /tmp/crun /usr/bin/crun
          crun --version

      - name: Last ned alle genererte artefaktar
        uses: actions/download-artifact@v8
        with:
          pattern: generated-*
          path: generated-merged/

      - name: Slå saman domene-artefaktar til generated/
        run: |
          mkdir -p generated/
          for domain in ap-no begrepskatalog fair fint modellkatalog ngr oreg samt; do
            if [ -d "generated-merged/generated-$domain" ]; then
              mv "generated-merged/generated-$domain" "generated/$domain"
            fi
          done

      - name: Logg inn på GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Last mkdocs-local image frå GHCR
        run: |
          GHCR_TAG="ghcr.io/${{ github.repository_owner }}/mkdocs-local:${{ hashFiles('src/assets/containers/Dockerfile.mkdocs') }}"
          echo "Lastar mkdocs-local frå GHCR: $GHCR_TAG"
          podman pull "$GHCR_TAG"
          podman tag "$GHCR_TAG" localhost/mkdocs-local:latest

      - name: Cache mkdocs-build-cache
        uses: actions/cache@v6
        with:
          path: mkdocs/.cache/
          key: mkdocs-build-${{ hashFiles('src/linkml/**', 'src/assets/containers/Dockerfile.mkdocs', 'src/assets/templates/**', 'mkdocs/docs/stylesheets/**', 'mkdocs/docs/javascripts/**', 'mkdocs/overrides/**') }}
          restore-keys: mkdocs-build-

      - name: Publiser og bygg dokumentasjonsportal
        run: |
          make docs-publish
          make docs-build

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Last opp Pages-artefakt
        uses: actions/upload-pages-artifact@v5
        with:
          path: mkdocs/site/

      - name: Deploy til GitHub Pages (forsøk 1)
        id: deploy-attempt-1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før retry (dersom forsøk 1 feila)
        if: steps.deploy-attempt-1.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment feila — ventar 30 sekund før retry..."
          sleep 30

      - name: Deploy til GitHub Pages (forsøk 2)
        id: deploy-attempt-2
        if: steps.deploy-attempt-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før siste retry (dersom forsøk 2 feila)
        if: steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages deployment feila igjen — ventar 60 sekund før siste forsøk..."
          sleep 60

      - name: Deploy til GitHub Pages (forsøk 3 — siste)
        id: deploy
        if: steps.deploy-attempt-1.outcome == 'failure' && steps.deploy-attempt-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
