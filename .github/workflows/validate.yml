name: Validate

# Validerer alle skjema, eksempelfiler og datafiler mot validation_policy og
# publiseringspolicyer. Validation-loggar vert lagra til src/linkml/*/validation/
# og committed via PR (ikkje direkte til main).
#
# Loggar vert lagra per versjon i src/linkml/<domain>/<model>/validation/<version>/:
# - <policy>.json: skjema-validering mot validation_policy frå manifest.yaml
# - instance-<namn>.json: eksempelfil-validering

on:
  schedule:
    - cron: '0 2 * * *'  # Nattleg validering kl 02:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/linkml/**'
      - 'src/mcp-linkml-validator/**'

jobs:

  check-publish-version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Krev version:-felt i alle publish_external-skjema
        run: |
          fail=0
          for mf in $(find src/linkml -name "manifest.yaml"); do
            grep -q "publish_external: true" "$mf" || continue
            grep -q "generators:" "$mf" || continue
            dir=$(dirname "$mf")
            schema=$(find "$dir" -maxdepth 1 -name "*-schema.yaml" | head -1)
            [[ -z "$schema" ]] && continue
            if ! grep -q "^version:" "$schema"; then
              echo "FEIL: $schema manglar version:-felt (publish_external: true)"
              fail=1
            fi
          done
          exit $fail

  commitlint:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Oppgrader crun til støtte for OCI v1-image
        run: |
          CRUN_VERSION=1.18.2
          wget -q https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64 -O /tmp/crun
          chmod +x /tmp/crun
          sudo mv /tmp/crun /usr/bin/crun
          crun --version
      - name: Valider commit-meldingar (conventional commits)
        run: |
          podman run --rm \
            -v "$PWD:/repo" -w /repo \
            --entrypoint="" \
            node:22-alpine \
            sh -c "apk add --no-cache git 2>/dev/null && \
              npm install --save-dev @commitlint/cli @commitlint/config-conventional 2>/dev/null && \
              echo 'module.exports={extends:[\"@commitlint/config-conventional\"]}' > commitlint.config.js && \
              npx commitlint --from origin/${{ github.base_ref }} --to HEAD"

  checkout-source:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fjern gamle valideringsloggar før artifact-upload
        run: |
          # Ekskluder validation/-katalogar frå source-artifact
          # slik at berre nygenerte loggar vert lasta opp seinare
          find src/linkml -type d -name validation -exec rm -rf {} + 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            src/
            .github/
            Makefile
            make/
          retention-days: 1

  build-validator:
    needs: [checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
      - name: Oppgrader crun til støtte for OCI v1-image
        run: |
          CRUN_VERSION=1.18.2
          wget -q https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64 -O /tmp/crun
          chmod +x /tmp/crun
          sudo mv /tmp/crun /usr/bin/crun
          crun --version

      # mcp-linkml-validator
      - name: Logg inn på GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sjekk om mcp-linkml-validator finst i GHCR
        id: ghcr-check-mcp
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/mcp-linkml-validator:${{ hashFiles('src/assets/containers/Dockerfile.mcp-linkml-validator', 'src/mcp-linkml-validator/requirements.txt') }}
          if podman pull "$IMAGE" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            podman tag "$IMAGE" mcp-linkml-validator:latest
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Bygg mcp-linkml-validator image
        if: steps.ghcr-check-mcp.outputs.exists != 'true'
        run: make build-docker-mcp-validator

      - name: Push mcp-linkml-validator til GHCR
        if: steps.ghcr-check-mcp.outputs.exists != 'true'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/mcp-linkml-validator:${{ hashFiles('src/assets/containers/Dockerfile.mcp-linkml-validator', 'src/mcp-linkml-validator/requirements.txt') }}
          podman tag mcp-linkml-validator "$IMAGE"
          podman push "$IMAGE"

      # linkml-local
      - name: Sjekk om linkml-local finst i GHCR
        id: ghcr-check-linkml
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/linkml-local:${{ hashFiles('src/assets/containers/Dockerfile.linkml') }}
          if podman pull "$IMAGE" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            podman tag "$IMAGE" localhost/linkml-local:latest
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Bygg linkml-local image
        if: steps.ghcr-check-linkml.outputs.exists != 'true'
        run: make build-docker-linkml

      - name: Push linkml-local til GHCR
        if: steps.ghcr-check-linkml.outputs.exists != 'true'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/linkml-local:${{ hashFiles('src/assets/containers/Dockerfile.linkml') }}
          podman tag localhost/linkml-local:latest "$IMAGE"
          podman push "$IMAGE"

  validate:
    name: "validate / ${{ matrix.domain }}"
    needs: build-validator
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        domain: [ap-no, begrepskatalog, fair, fint, modellkatalog, ngr, oreg, samt]
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Cache validering (${{ matrix.domain }})
        id: cache-validated
        uses: actions/cache@v6
        with:
          path: .validated-${{ matrix.domain }}
          key: validated-${{ matrix.domain }}-${{ hashFiles(format('src/linkml/{0}/**/*-schema.yaml', matrix.domain), format('src/linkml/{0}/**/build.yaml', matrix.domain), format('src/linkml/{0}/**/examples/**', matrix.domain), format('src/linkml/{0}/**/data/**', matrix.domain), 'src/mcp-linkml-validator/server.py', 'src/mcp-linkml-validator/policies/**', 'src/mcp-linkml-validator/flatten-and-validate.bash', 'src/assets/containers/Dockerfile.mcp-linkml-validator', 'src/mcp-linkml-validator/requirements.txt', '.github/workflows/validate.yml') }}

      - name: Logg inn på GHCR
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Hent mcp-linkml-validator frå GHCR
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/mcp-linkml-validator:${{ hashFiles('src/assets/containers/Dockerfile.mcp-linkml-validator', 'src/mcp-linkml-validator/requirements.txt') }}
          podman pull "$IMAGE"
          podman tag "$IMAGE" mcp-linkml-validator:latest

      - name: Hent linkml-local frå GHCR
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/linkml-local:${{ hashFiles('src/assets/containers/Dockerfile.linkml') }}
          podman pull "$IMAGE"
          podman tag "$IMAGE" localhost/linkml-local:latest

      - name: Valider skjema mot validation_policy
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: |
          # Valider alle skjema i dette domenet med validation_policy frå build.yaml
          FAILED=0
          for manifest in $(find src/linkml/${{ matrix.domain }} -name build.yaml -type f); do
            if grep -q "^generators:" "$manifest"; then
              echo "Validerer skjema frå manifest: $manifest"
              if ! bash src/assets/scripts/ci/run-validation.sh --manifest "$manifest"; then
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          exit $FAILED

      - name: Valider eksempelfiler mot skjema
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: make validate-examples DOMAIN=${{ matrix.domain }}

      - name: Valider datafiler mot publiseringspolicyer
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: make validate-data DOMAIN=${{ matrix.domain }}

      - name: Sjekk at publiserte URI-ar ikkje er fjerna
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: make check-published-uris

      - name: Merk validering som vellykka
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: touch .validated-${{ matrix.domain }}

      - name: Last opp validation-loggar
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs-${{ matrix.domain }}
          path: src/linkml/${{ matrix.domain }}/**/validation/**/*.json
          retention-days: 7
          if-no-files-found: ignore

  create-pr-with-validation-logs:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Last ned validation-loggar frå alle domene
        run: |
          # Last ned kvar domain-artifact separat for å behalde domain-nivå i stien
          for domain in ap-no begrepskatalog fair fint modellkatalog ngr oreg samt; do
            artifact_name="validation-logs-$domain"

            # Sjekk om artifact finst (kan vere tomt dersom ingen loggar)
            if gh run download ${{ github.run_id }} -n "$artifact_name" -D "/tmp/$artifact_name" 2>/dev/null; then
              # Kopier loggar til rett stad: src/linkml/<domain>/<modell>/validation/...
              if [ -d "/tmp/$artifact_name" ]; then
                for model_dir in /tmp/$artifact_name/*/; do
                  if [ ! -d "$model_dir" ]; then
                    continue
                  fi

                  model=$(basename "$model_dir")
                  target="src/linkml/$domain/$model"

                  # Kopier validation-katalogen
                  if [ -d "$model_dir/validation" ]; then
                    mkdir -p "$target"
                    cp -r "$model_dir/validation" "$target/"
                    echo "✓ Kopierte $domain/$model validation-loggar"
                  fi
                done
              fi
            else
              echo "⚠️  Ingen artifact for $domain"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filtrer ut uendra loggar
        run: |
          # Python-script som samanliknar nye loggar med git HEAD
          # Fjernar identiske loggar (ignorer validated_at-felt)
          python3 src/assets/scripts/ci/filter-unchanged-logs.py

      - name: Stage nye og endra valideringsloggar
        run: |
          # Stage alle validation-filer (både nye og endra)
          # validation/ er no fjerna frå .gitignore, så -f er ikkje nødvendig
          git add src/linkml/**/validation/**/*.json

      - name: Lag PR med valideringsloggar
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          commit-message: "chore(validation): oppdater valideringsloggar"
          branch: validation-logs-update
          delete-branch: true
          title: "chore(validation): oppdater valideringsloggar"
          body: |
            Automatisk oppdatering av valideringsloggar frå nattleg validering.

            Sjekk diff for å sjå nye violations eller forbettringar.
          labels: automated, validation
