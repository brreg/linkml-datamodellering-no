name: Validate

# Validerer alle skjema, eksempelfiler og datafiler mot validation_policy og
# publiseringspolicyer. Validation-loggar vert lagra til src/linkml/*/validation/
# og committed via PR (ikkje direkte til main).
#
# Loggar vert lagra per versjon i src/linkml/<domain>/<model>/validation/<version>/:
# - <policy>.json: skjema-validering mot validation_policy frå manifest.yaml
# - instance-<navn>.json: eksempelfil-validering

on:
  schedule:
    - cron: '0 2 * * *'  # Nattleg validering kl 02:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/linkml/**'
      - 'src/mcp-linkml-validator/**'

# Kansellerer utdaterte køyringar: ein ny push til same PR treng ikkje
# fullføre valideringa av den førre pusheen. Event-navnet er med i gruppa
# slik at ei nattleg schedule-køyring aldri vert kansellert av ein PR (eller
# omvendt) — dei har ulikt formål (nattleg drift-sjekk vs. PR-gate).
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  check-publish-version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Krev version:-felt i alle publish_external-skjema
        run: |
          # BUG-fiks: dette søkte tidlegare etter "manifest.yaml", eit
          # filnavn som vart bytt til "build.yaml" ein gong i repoet si
          # historie utan at dette steget (eller README/CONTRIBUTING/
          # GOVERNANCE/COMMANDS.md) vart oppdatert. find fann difor 0
          # filer, løkka køyrde 0 gonger, og jobben returnerte alltid
          # suksess UTAN å sjekke noko som helst — retta saman med
          # dokumentasjonen i same økt.
          fail=0
          for mf in $(find src/linkml -name "build.yaml"); do
            grep -q "publish_external: true" "$mf" || continue
            grep -q "generators:" "$mf" || continue
            dir=$(dirname "$mf")
            schema=$(find "$dir" -maxdepth 1 -name "*-schema.yaml" | head -1)
            [[ -z "$schema" ]] && continue
            if ! grep -q "^version:" "$schema"; then
              echo "FEIL: $schema manglar version:-felt (publish_external: true)"
              fail=1
            fi
          done
          exit $fail

  commitlint:
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Oppgrader crun
        uses: ./.github/actions/upgrade-crun
      - name: Valider commit-meldingar (conventional commits)
        run: |
          podman run --rm \
            -v "$PWD:/repo" -w /repo \
            --entrypoint="" \
            node:22-alpine \
            sh -c "apk add --no-cache git 2>/dev/null && \
              npm install --save-dev @commitlint/cli @commitlint/config-conventional 2>/dev/null && \
              echo 'module.exports={extends:[\"@commitlint/config-conventional\"]}' > commitlint.config.js && \
              npx commitlint --from origin/${{ github.base_ref }} --to HEAD"

  checkout-source:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.discover.outputs.domains }}
      domain_list: ${{ steps.discover.outputs.domain_list }}
      images: ${{ steps.image-tags-filtered.outputs.images }}
      image_tags: ${{ steps.image-tags.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Oppdag domene
        id: discover
        uses: ./.github/actions/discover-domains
      - name: Bygg image-tag-oppslag
        id: image-tags
        uses: ./.github/actions/compute-image-tags
      - name: Filtrer til always_required-images for validering
        id: image-tags-filtered
        run: |
          # Validering treng alle always_required-images (jf. generate.yml sitt
          # tilsvarande steg) — ikkje berre linkml-local + mcp-linkml-validator.
          # python-pytest er også always_required: save-validation-log.py
          # (kalla frå make validate-data/validate-examples, begge CI-kalla
          # per domene nedanfor) køyrer i python-pytest-kontaineren. Denne
          # lista vart tidlegare
          # hardkoda til dei to andre og gløymde python-pytest — då prøvde
          # PYTHON_RUN å pulle localhost/python-pytest:latest som eit ekte
          # registry og feila. Slå opp always_required dynamisk i staden for
          # å hardkode, jf. DRY-prinsippet i CLAUDE.md. `image_tags` treng
          # derimot ikkje filtrerast — superset-outputen frå
          # compute-image-tags er harmlaus å bruke direkte (ubrukte
          # nøklar i eit JSON-oppslag kostar ingenting).
          images=$(echo '${{ steps.image-tags.outputs.images }}' | jq -c '[.[] | select(.always_required) | {name, make_target}]')
          echo "images=$images" >> "$GITHUB_OUTPUT"
      - name: Fjern gamle valideringsloggar før artifact-upload
        run: |
          # Ekskluder validation/-katalogar frå source-artifact
          # slik at berre nygenerte loggar vert lasta opp seinare
          find src/linkml -type d -name validation -exec rm -rf {} + 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            src/
            .github/
            Makefile
            make/
          retention-days: 1
          include-hidden-files: true

  ensure-images:
    name: "build-image / ${{ matrix.image.name }}"
    needs: [checkout-source]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      # Image-lista kjem frå src/assets/containers/images.json (autoritativ
      # kjelde, filtrert til always_required-images i checkout-source sitt
      # image-tags-steg) — ikkje hardkoda her lenger.
      matrix:
        image: ${{ fromJson(needs.checkout-source.outputs.images) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
      - name: Oppgrader crun
        uses: ./.github/actions/upgrade-crun

      - name: Logg inn på GHCR
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sikre ${{ matrix.image.name }} i GHCR
        uses: ./.github/actions/ensure-image
        with:
          name: ${{ matrix.image.name }}
          tag: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ fromJson(needs.checkout-source.outputs.image_tags)[matrix.image.name] }}
          make_target: ${{ matrix.image.make_target }}

  validate:
    name: "validate / ${{ matrix.domain }}"
    needs: [ensure-images, checkout-source]
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        domain: ${{ fromJson(needs.checkout-source.outputs.domains) }}
      fail-fast: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source

      - name: Cache validering (${{ matrix.domain }})
        id: cache-validated
        uses: actions/cache@v6
        with:
          path: .validated-${{ matrix.domain }}
          key: validated-${{ matrix.domain }}-${{ hashFiles(format('src/linkml/{0}/**/*-schema.yaml', matrix.domain), format('src/linkml/{0}/**/build.yaml', matrix.domain), format('src/linkml/{0}/**/examples/**', matrix.domain), format('src/linkml/{0}/**/data/**', matrix.domain), 'src/mcp-linkml-validator/server.py', 'src/mcp-linkml-validator/policies/**', 'src/mcp-linkml-validator/flatten-and-validate.bash', 'src/assets/containers/Dockerfile.mcp-linkml', '.github/workflows/validate.yml') }}

      - name: Logg inn på GHCR
        if: steps.cache-validated.outputs.cache-hit != 'true'
        uses: ./.github/actions/ghcr-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Last images inn i podman frå GHCR
        if: steps.cache-validated.outputs.cache-hit != 'true'
        uses: ./.github/actions/pull-images
        with:
          images: ${{ needs.checkout-source.outputs.images }}
          image_tags: ${{ needs.checkout-source.outputs.image_tags }}

      - name: Valider skjema mot validation_policy
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: |
          # Valider alle skjema i dette domenet med validation_policy frå build.yaml,
          # parallelt. Kvart run-validation.sh-kall flatar ut og validerer berre sitt
          # eige skjema (unik mktemp-fil, unik loggsti) — heilt isolert frå andre
          # skjema sin køyring, så parallellisering av løkka er trygt. Same mønster
          # som generate.yml sitt tilsvarande steg og mkdocs/publish.sh (Steg 2).
          # Ekskluder begrepssamling-* katalogar (datakatalogar, ikkje skjema)
          declare -a PIDS=()
          declare -a MANIFESTS=()
          for manifest in $(find src/linkml/${{ matrix.domain }} -name build.yaml -type f | grep -v '/begrepssamling-'); do
            if grep -q "^generators:" "$manifest"; then
              (
                start=$(date +%s%3N)
                rc=0
                log_path=$(bash src/assets/scripts/makefile/run-validation.sh --manifest "$manifest" --quiet) || rc=$?
                elapsed=$(( $(date +%s%3N) - start ))
                # Kort visningssti (utan "src/linkml/<domain>/"-prefiks) — sjå
                # specs/done/kort-validering-logglinje.md.
                model=$(basename "$(dirname "$manifest")")
                schema_short="$model/$model-schema.yaml"
                log_short="$model/${log_path#*/"$model"/}"
                if [ $rc -eq 0 ]; then
                  printf "✓ Validert %s → %s (%d.%ds)\n" "$schema_short" "$log_short" $((elapsed / 1000)) $((elapsed % 1000 / 100))
                else
                  printf "✗ Validering feila for %s → %s (%d.%ds)\n" "$schema_short" "$log_short" $((elapsed / 1000)) $((elapsed % 1000 / 100))
                fi
                exit $rc
              ) &
              PIDS+=($!)
              MANIFESTS+=("$manifest")
            fi
          done

          FAILED=0
          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              echo "::error file=${MANIFESTS[$i]}::Validering feila"
              FAILED=$((FAILED + 1))
            fi
          done
          exit $FAILED

      - name: Valider eksempelfiler mot skjema
        if: steps.cache-validated.outputs.cache-hit != 'true'
        env:
          LOGLVL: DEBUG
        run: make validate-examples DOMAIN=${{ matrix.domain }}

      - name: Valider datafiler mot publiseringspolicyer
        if: steps.cache-validated.outputs.cache-hit != 'true'
        env:
          LOGLVL: DEBUG
        run: make validate-data DOMAIN=${{ matrix.domain }}

      - name: Sjekk at publiserte URI-ar ikkje er fjerna
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: make check-published-uris

      - name: Merk validering som vellykka
        if: steps.cache-validated.outputs.cache-hit != 'true'
        run: touch .validated-${{ matrix.domain }}

      - name: Last opp validation-loggar
        if: steps.cache-validated.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs-${{ matrix.domain }}
          path: src/linkml/${{ matrix.domain }}/**/validation/**/*.json
          retention-days: 7
          if-no-files-found: ignore

  create-pr-with-validation-logs:
    needs: [validate, checkout-source]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Last ned validation-loggar frå alle domene
        run: |
          # Last ned kvar domain-artifact direkte til gjeldande katalog
          # (artifacts inneheld allereie src/linkml/<domain>/<modell>/validation/-struktur)
          for domain in ${{ needs.checkout-source.outputs.domain_list }}; do
            artifact_name="validation-logs-$domain"
            if gh run download ${{ github.run_id }} -n "$artifact_name" -D . 2>/dev/null; then
              echo "✓ Lasta ned $artifact_name"
            else
              echo "⚠️  Ingen artifact for $domain"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage alle valideringsloggar
        run: |
          # Stage alle validation-filer (både nye og endra)
          # validation/ er no fjerna frå .gitignore, så -f er ikkje nødvendig
          # Feil kan vere legitimt "ingen filer å leggje til" (fyrste køyring,
          # ingen nye/endra loggar) — men vis alltid årsaka i staden for å
          # skjule ho, sidan ei reell git-feil (t.d. index-problem) elles er umogleg å oppdage.
          if ! git add src/linkml/**/validation/**/*.json 2>/tmp/git-add-validation.log; then
            echo "::warning::git add fann ingen valideringsloggar å leggje til — dette er venta viss ingen skjema vart validerte i denne køyringa"
            cat /tmp/git-add-validation.log >&2
          fi

      - name: Sjekk om det finst endringar
        id: check-changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Ingen endringar å committe (alle domene fekk cache hit)"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Endringar funne - lagar PR"
          fi

      - name: Lag PR med valideringsloggar
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          commit-message: "chore(validation): oppdater valideringsloggar"
          branch: validation-logs-update
          delete-branch: true
          title: "chore(validation): oppdater valideringsloggar"
          body: |
            Automatisk oppdatering av valideringsloggar frå nattleg validering.

            Sjekk diff for å sjå nye violations eller forbettringar.
          labels: automated, validation
