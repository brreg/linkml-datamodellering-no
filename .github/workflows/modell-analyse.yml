name: Modell-analyse

# Informative rapportar på tvers av alle skjema: liknande klasse-/slotnavn
# og IRI-dereferering (IRI resolution). Feilar aldri CI — rapportane er innspel til manuell
# gjennomgang, ikkje ein valideringspolicy. Sjå COMMANDS.md § Modell-analyse
# for dei underliggande make-targeta.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * 1' # Kvar måndag kl. 07:00 UTC

jobs:
  ensure-images:
    # Sikrar python-pytest i GHCR (bygg+push berre ved cache-miss) — same
    # mønster som generate.yml/lenkje-og-mermaid-sjekk.yml/validate.yml,
    # men utan matrise sidan alle 11 nedstraums-jobbane berre treng dette
    # eine biletet. Sjå specs/done/evaluering-dry-github-workflows.md (K1).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_tags: ${{ steps.image-tags.outputs.image_tags }}
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg image-tag-oppslag
        id: image-tags
        uses: ./.github/actions/compute-image-tags

      - name: Set opp podman (crun + GHCR-login)
        uses: ./.github/actions/prepare-podman
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sikre python-pytest i GHCR
        uses: ./.github/actions/ensure-image
        with:
          name: python-pytest
          tag: ghcr.io/${{ github.repository_owner }}/python-pytest:${{ fromJson(steps.image-tags.outputs.image_tags)['python-pytest'] }}
          make_target: build-docker-python

  similar-classes-domain:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Finn klasser med liknande navn (same domene)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-similar-classes-domain
          report-file: similar-classes-domain-report.md
          summary-title: Liknande klassenavn
          artifact-name: similar-classes-domain-report

  similar-classes-all:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Finn klasser med liknande navn (alle domene)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-similar-classes-all
          report-file: similar-classes-all-report.md
          summary-title: Liknande klassenavn (alle domene)
          artifact-name: similar-classes-all-report

  similar-slots-domain:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Finn slots med liknande navn (same domene)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-similar-slots-domain
          report-file: similar-slots-domain-report.md
          summary-title: Liknande slotnavn (same domene)
          artifact-name: similar-slots-domain-report

  similar-slots-all:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Finn slots med liknande navn (alle domene)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-similar-slots-all
          report-file: similar-slots-all-report.md
          summary-title: Liknande slotnavn (alle domene)
          artifact-name: similar-slots-all-report

  similar-types-domain:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Finn typar med liknande navn (same domene)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-similar-types-domain
          report-file: similar-types-domain-report.md
          summary-title: Liknande typenavn (same domene)
          artifact-name: similar-types-domain-report

  similar-types-all:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Finn typar med liknande navn (alle domene)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-similar-types-all
          report-file: similar-types-all-report.md
          summary-title: Liknande typenavn (alle domene)
          artifact-name: similar-types-all-report

  iri-dereferering:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Test IRI-dereferering (IRI resolution)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-iri-dereferering
          report-file: iri-dereferering-report.md
          summary-title: IRI-dereferering (IRI resolution)
          artifact-name: iri-dereferering-report

  innhaldsforhandling:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Test innhaldsforhandling (Content negotiation)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-innhaldsforhandling
          report-file: innhaldsforhandling-report.md
          summary-title: Innhaldsforhandling (Content negotiation)
          artifact-name: innhaldsforhandling-report

  ap-no-gjenbruk:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Sjekk gjenbruk av common-ap-no-schema (Digdir-regel 14)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-ap-no-gjenbruk
          report-file: ap-no-gjenbruk-report.md
          summary-title: AP-NO-gjenbruk (Digdir-regel 14)
          artifact-name: ap-no-gjenbruk-report

  modell-sammenhenger:
    needs: ensure-images
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Kryssreferer importgraf mot modellkatalogen (Digdir-regel 12)
        uses: ./.github/actions/run-modell-analyse
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-tags: ${{ needs.ensure-images.outputs.image_tags }}
          make-target: analyse-modell-sammenhenger
          report-file: modell-sammenhenger-report.md
          summary-title: Samanhengar mellom modellar (Digdir-regel 12)
          artifact-name: modell-sammenhenger-report

  sammendrag:
    needs:
      - ensure-images
      - similar-classes-domain
      - similar-classes-all
      - similar-slots-domain
      - similar-slots-all
      - similar-types-domain
      - similar-types-all
      - iri-dereferering
      - innhaldsforhandling
      - ap-no-gjenbruk
      - modell-sammenhenger
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Set opp podman (crun + GHCR-login + hent python-pytest)
        uses: ./.github/actions/prepare-podman
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          images: '[{"name":"python-pytest","make_target":"build-docker-python"}]'
          image_tags: ${{ needs.ensure-images.outputs.image_tags }}

      - name: Last ned alle rapportar
        uses: actions/download-artifact@v8
        with:
          pattern: "*-report"
          merge-multiple: true

      - name: Generer sammendrag
        run: |
          set -uo pipefail
          make analyse-sammendrag > sammendrag-report.md
          {
            echo "## Sammendrag"
            cat sammendrag-report.md
          } >> "$GITHUB_STEP_SUMMARY"
