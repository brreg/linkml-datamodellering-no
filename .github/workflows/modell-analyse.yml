name: Modell-analyse

# Informative rapportar på tvers av alle skjema: liknande klasse-/slotnamn
# og IRI-dereferering (IRI resolution). Feilar aldri CI — rapportane er innspel til manuell
# gjennomgang, ikkje ein valideringspolicy. Sjå COMMANDS.md § Modell-analyse
# for dei underliggande make-targeta.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 7 * * 1' # Kvar måndag kl. 07:00 UTC

jobs:
  similar-classes-domain:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg python-container
        run: make build-docker-python

      - name: Finn klasser med liknande namn (same domene)
        run: |
          set -uo pipefail
          make analyse-similar-classes-domain > similar-classes-domain-report.md
          {
            echo "## Liknande klassenamn (same domene)"
            cat similar-classes-domain-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: similar-classes-domain-report
          path: similar-classes-domain-report.md
          retention-days: 30

  similar-classes-all:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg python-container
        run: make build-docker-python

      - name: Finn klasser med liknande namn (alle domene)
        run: |
          set -uo pipefail
          make analyse-similar-classes-all > similar-classes-all-report.md
          {
            echo "## Liknande klassenamn (alle domene)"
            cat similar-classes-all-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: similar-classes-all-report
          path: similar-classes-all-report.md
          retention-days: 30

  similar-slots-domain:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg python-container
        run: make build-docker-python

      - name: Finn slots med liknande namn (same domene)
        run: |
          set -uo pipefail
          make analyse-similar-slots-domain > similar-slots-domain-report.md
          {
            echo "## Liknande slotnamn (same domene)"
            cat similar-slots-domain-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: similar-slots-domain-report
          path: similar-slots-domain-report.md
          retention-days: 30

  similar-slots-all:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg python-container
        run: make build-docker-python

      - name: Finn slots med liknande namn (alle domene)
        run: |
          set -uo pipefail
          make analyse-similar-slots-all > similar-slots-all-report.md
          {
            echo "## Liknande slotnamn (alle domene)"
            cat similar-slots-all-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: similar-slots-all-report
          path: similar-slots-all-report.md
          retention-days: 30

  iri-dereferering:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg python-container
        run: make build-docker-python

      - name: Test IRI-dereferering (IRI resolution)
        run: |
          set -uo pipefail
          make analyse-iri-dereferering > iri-dereferering-report.md
          {
            echo "## IRI-dereferering (IRI resolution)"
            cat iri-dereferering-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iri-dereferering-report
          path: iri-dereferering-report.md
          retention-days: 30

  innhaldsforhandling:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg python-container
        run: make build-docker-python

      - name: Test innhaldsforhandling (Content negotiation)
        run: |
          set -uo pipefail
          make analyse-innhaldsforhandling > innhaldsforhandling-report.md
          {
            echo "## Innhaldsforhandling (Content negotiation)"
            cat innhaldsforhandling-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: innhaldsforhandling-report
          path: innhaldsforhandling-report.md
          retention-days: 30

  sammendrag:
    needs:
      - similar-classes-domain
      - similar-classes-all
      - similar-slots-domain
      - similar-slots-all
      - iri-dereferering
      - innhaldsforhandling
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v7

      - name: Bygg python-container
        run: make build-docker-python

      - name: Last ned alle rapportar
        uses: actions/download-artifact@v8
        with:
          pattern: "*-report"
          merge-multiple: true

      - name: Generer sammendrag
        run: |
          set -uo pipefail
          make analyse-sammendrag > sammendrag-report.md
          {
            echo "## Sammendrag"
            cat sammendrag-report.md
          } >> "$GITHUB_STEP_SUMMARY"
