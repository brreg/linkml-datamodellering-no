version: 1
extends: bronze

description: >
  Policy for begrepskatalogskjema som skal publiserast til Felles Begrepskatalog.
  Validerer at skjemaet importerer SKOS-AP-NO-Begrep og eksponerer dei nødvendige
  klassane og slotsa via containerklassen (tree_root).
  Arvar bronselaget: grunnleggande metadata- og modelleringskrav.

required:
  schema: [id, name]
  class: []
  slot: []

recommended:
  # title og version er IKKJE lista her sjølv om dei er nyttige metadata —
  # begge er alt `required` via arva bronze.yaml-liste. Å liste dei her òg
  # ville gitt både ein error (required) og ein warning (recommended) for
  # same manglande felt (sjå specs/done/full-gjennomgang-policy-alvorsgrad-
  # og-overlapp.md, Funn B5).
  schema: [description]
  class: []
  slot: []

checks:

  # ── Import-krav ─────────────────────────────────────────────────────────────

  schema_importerer_skos_ap_no:
    severity: error
    description: >
      Skjemaet må importere skos-ap-no-schema (direkte eller transitivt).
      SKOS-AP-NO-Begrep er grunnlaget for alle begrepskatalogskjema.
    check: schema_imports
    must_import: skos-ap-no-schema
    characteristic_class: Begrep

  # ── Prefiks-krav ─────────────────────────────────────────────────────────────

  schema_brukar_skos_prefix:
    severity: error
    description: >
      Skjemaet må deklarere skos:-prefikset. Alle begrep er skos:Concept.
    check: schema_declares_standard_prefix
    standard_prefixes: [skos]
    spec_url: https://informasjonsforvaltning.github.io/skos-ap-no-begrep/#Navnerom-brukt-i-standarden

  schema_brukar_dct_prefix:
    severity: error
    description: >
      Skjemaet må deklarere dct:-prefikset (Dublin Core Terms).
      Nødvendig for dct:identifier, dct:publisher, dct:title o.a.
    check: schema_declares_standard_prefix
    standard_prefixes: [dct]
    spec_url: https://informasjonsforvaltning.github.io/skos-ap-no-begrep/#Navnerom-brukt-i-standarden

  # ── Containerklasse-krav ─────────────────────────────────────────────────────
  # Repo-konvensjon (tree_root-mønster) — spec_url peikar til klassen sin
  # generelle omtale for kontekst, ikkje til eit normativt containerkrav.

  container_har_begrep:
    severity: error
    description: >
      Containerklassen (tree_root) må ha eit attributt med range Begrep.
      Felles Begrepskatalog krev minst eitt begrep per katalog.
    check: container_has_class
    class: Begrep
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep

  container_har_samling:
    severity: warning
    description: >
      Containerklassen bør ha eit attributt med range Samling.
      Anbefalt for å organisere begrep i navngjeve samlingar (skos:Collection).
    check: container_has_class
    class: Samling
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrepssamling

  # ── Begrep-krav (skos:Concept) — SKOS-AP-NO-Begrep obligatoriske ─────────────

  begrep_har_anbefalt_term:
    severity: error
    description: >
      Begrep må ha skos:prefLabel (anbefalt term). Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: skos:prefLabel
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-anbefalt-term

  begrep_anbefalt_term_er_multivalued_langstring:
    severity: warning
    description: >
      Begrep sin anbefalt_term (skos:prefLabel) bør ha range LangString og
      multivalued: true for å støtte tospråkskravet (bokmål + nynorsk).
      Merk: Instansvalidering av tospråkskravet er ikkje mogleg i YAML-format
      (sjå specs/bugs/langstring-rdflib-roundtrip.md). Bruk RDF-validering
      (SHACL) for å verifiere faktisk tospråkdekning i TTL-fila.
    check: slot_has_range_and_multivalued
    class: Begrep
    slot_uri: skos:prefLabel
    expected_range: LangString
    expected_multivalued: true
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-anbefalt-term

  begrep_har_definisjon:
    severity: error
    description: >
      Begrep må ha skos:definition eller euvoc:xlDefinition.
      SKOS-AP-NO-Begrep krev minst éin av desse formene.
    check: merged_class_has_any_slot_with_uri
    class: Begrep
    slot_uris:
      - skos:definition
      - euvoc:xlDefinition
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-definisjon-direkte-angivelse

  begrep_har_identifikator:
    severity: error
    description: >
      Begrep må ha dct:identifier. Obligatorisk i SKOS-AP-NO-Begrep —
      gir kvart begrep ein persistent URI.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: dct:identifier
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-identifikator

  begrep_har_utgjevar:
    severity: error
    description: >
      Begrep må ha dct:publisher. Obligatorisk i SKOS-AP-NO-Begrep —
      peikar til ansvarleg organisasjon.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: dct:publisher
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-publisert-av

  begrep_har_kontaktpunkt:
    severity: error
    description: >
      Begrep må ha dcat:contactPoint. Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: dcat:contactPoint
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-kontaktpunkt

  # ── Begrep-krav — SKOS-AP-NO-Begrep anbefalte ────────────────────────────────

  begrep_har_fagomrade:
    severity: warning
    description: >
      Begrep bør ha dct:subject (fagområde / LOS-tema). Anbefalt i SKOS-AP-NO-Begrep
      — gir kontekst og moglegheit for temafiltrering i katalogen.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: dct:subject
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-fagområde

  begrep_har_ansvarleg_verksemd:
    severity: warning
    description: >
      Begrep bør ha dct:creator (ansvarleg verksemd). Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: dct:creator
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-ansvarlig-virksomhet

  begrep_har_gyldig_fra:
    severity: warning
    description: >
      Begrep bør ha euvoc:startDate (gyldig frå). Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: euvoc:startDate
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-dato-gyldig-fra-og-med

  begrep_har_gyldig_til:
    severity: warning
    description: >
      Begrep bør ha euvoc:endDate (gyldig til). Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: euvoc:endDate
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-dato-gyldig-til-og-med

  begrep_har_opprettingsdato:
    severity: warning
    description: >
      Begrep bør ha dct:created (opprettingsdato). Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: dct:created
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-dato-opprettet

  begrep_har_endringsdato:
    severity: warning
    description: >
      Begrep bør ha dct:modified (dato sist oppdatert). Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: dct:modified
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-dato-sist-oppdatert

  begrep_har_merknad:
    severity: warning
    description: >
      Begrep bør ha skos:scopeNote (merknad). Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: skos:scopeNote
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-merknad

  begrep_har_tillate_term:
    severity: warning
    description: >
      Begrep bør ha skos:altLabel (tillaten term). Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Begrep
    slot_uri: skos:altLabel
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-tillatt-term

  # ── Definisjon-krav (euvoc:XlNote) ───────────────────────────────────────────

  definisjon_har_tekst:
    severity: error
    description: >
      Definisjon må ha rdf:value (definisjonsteikst). Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Definisjon
    slot_uri: rdf:value
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Definisjon-tekst

  definisjon_har_kjelde_relasjon:
    severity: warning
    description: >
      Definisjon bør ha skosno:relationshipWithSource (kjelde-relasjon).
      Anbefalt i SKOS-AP-NO-Begrep — beskriv forholdet mellom definisjonen og kjelda.
    check: merged_class_has_slot_with_uri
    class: Definisjon
    slot_uri: skosno:relationshipWithSource
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Definisjon-forhold-til-kilde

  # ── AssosiativRelasjon-krav (skosno:AssociativeConceptRelation) ───────────────

  assosiativ_relasjon_har_til_omgrep:
    severity: error
    description: >
      AssosiativRelasjon må ha skosno:hasToConcept (til-omgrep).
      Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: AssosiativRelasjon
    slot_uri: skosno:hasToConcept
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Assosiativ-begrepsrelasjon-har-til-begrep

  assosiativ_relasjon_har_relasjontype:
    severity: error
    description: >
      AssosiativRelasjon må ha skosno:relationRole (relasjonstype).
      Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: AssosiativRelasjon
    slot_uri: skosno:relationRole
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Assosiativ-begrepsrelasjon-relasjonsrolle

  # ── GeneriskRelasjon-krav (skosno:GenericConceptRelation) ────────────────────

  generisk_relasjon_har_overomgrep:
    severity: error
    description: >
      GeneriskRelasjon må ha skosno:hasGenericConcept (overomgrep).
      Obligatorisk i SKOS-AP-NO-Begrep — skjemaet må støtte begge retningar.
    check: merged_class_has_slot_with_uri
    class: GeneriskRelasjon
    slot_uri: skosno:hasGenericConcept
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Generisk-begrepsrelasjon-har-overbegrep

  generisk_relasjon_har_underomgrep:
    severity: error
    description: >
      GeneriskRelasjon må ha skosno:hasSpecificConcept (underomgrep).
      Obligatorisk i SKOS-AP-NO-Begrep — skjemaet må støtte begge retningar.
    check: merged_class_has_slot_with_uri
    class: GeneriskRelasjon
    slot_uri: skosno:hasSpecificConcept
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Generisk-begrepsrelasjon-har-underbegrep

  generisk_relasjon_har_inndelingskriterium:
    severity: warning
    description: >
      GeneriskRelasjon bør ha dct:description (inndelingskriterium).
      Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: GeneriskRelasjon
    slot_uri: dct:description
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Generisk-begrepsrelasjon-inndelingskriterium

  # ── PartitivRelasjon-krav (skosno:PartitiveConceptRelation) ──────────────────

  partitiv_relasjon_har_delomgrep:
    severity: error
    description: >
      PartitivRelasjon må ha skosno:hasPartitiveConcept (delomgrep).
      Obligatorisk i SKOS-AP-NO-Begrep — skjemaet må støtte begge retningar.
    check: merged_class_has_slot_with_uri
    class: PartitivRelasjon
    slot_uri: skosno:hasPartitiveConcept
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Partitiv-begrepsrelasjon-har-delbegrep

  partitiv_relasjon_har_heilskapleg_omgrep:
    severity: error
    description: >
      PartitivRelasjon må ha skosno:hasComprehensiveConcept (heilskapleg omgrep).
      Obligatorisk i SKOS-AP-NO-Begrep — skjemaet må støtte begge retningar.
    check: merged_class_has_slot_with_uri
    class: PartitivRelasjon
    slot_uri: skosno:hasComprehensiveConcept
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Partitiv-begrepsrelasjon-har-helhetsbegrep

  partitiv_relasjon_har_inndelingskriterium:
    severity: warning
    description: >
      PartitivRelasjon bør ha dct:description (inndelingskriterium).
      Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: PartitivRelasjon
    slot_uri: dct:description
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Partitiv-begrepsrelasjon-inndelingskriterium

  # ── Samling-krav (skos:Collection) — SKOS-AP-NO-Begrep obligatoriske ─────────

  samling_har_identifikator:
    severity: error
    description: >
      Samling må ha dct:identifier. Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Samling
    slot_uri: dct:identifier
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrepssamling-identifikator

  samling_har_tittel:
    severity: error
    description: >
      Samling må ha dct:title (navn på samlinga). Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Samling
    slot_uri: dct:title
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrepssamling-navn

  samling_har_utgjevar:
    severity: error
    description: >
      Samling må ha dct:publisher. Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Samling
    slot_uri: dct:publisher
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrepssamling-publisert-av

  samling_har_kontaktpunkt:
    severity: error
    description: >
      Samling må ha dcat:contactPoint. Obligatorisk i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Samling
    slot_uri: dcat:contactPoint
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrepssamling-kontaktpunkt

  samling_har_medlem:
    severity: error
    description: >
      Samling må ha skos:member. Obligatorisk i SKOS-AP-NO-Begrep —
      samlinga må innehalde minst eitt begrep.
    check: merged_class_has_slot_with_uri
    class: Samling
    slot_uri: skos:member
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrepssamling-inneholder-begrep

  # ── Samling-krav — SKOS-AP-NO-Begrep anbefalte ───────────────────────────────

  samling_har_beskrivelse:
    severity: warning
    description: >
      Samling bør ha dct:description (beskriving av samlinga).
      Anbefalt i SKOS-AP-NO-Begrep.
    check: merged_class_has_slot_with_uri
    class: Samling
    slot_uri: dct:description
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrepssamling-beskrivelse

instance_checks:

  # ── Tospråkskrav (Avvik 10, avvik-skos-ap-no.md) ─────────────────────────────
  # Avgrensa til har_definisjon-varianten via ID-suffikskonvensjonen, sidan
  # LangString ikkje bærer språk-tag per verdi (jf. specs/bugs/langstring-rdflib-roundtrip.md).

  begrep_har_definisjon_pa_nb_og_nn:
    severity: warning
    description: >
      Begrep med har_definisjon bør ha minst éi Definisjon med id som endar
      på «-nb» og minst éi som endar på «-nn» (tospråkskravet, Avvik 10 i
      avvik-skos-ap-no.md). Sjekken er avgrensa til ID-suffiks-konvensjonen
      sidan LangString ikkje bærer språk-tag per verdi.
    check: instance_begrep_definisjon_language_coverage
    relasjon_slot_uri: euvoc:xlDefinition
    krev_spraak: [nb, nn]
    id_suffiks_pattern: "-([a-z]{2})$"
    spec_url: https://data.norge.no/specification/skos-ap-no-begrep#Begrep-anbefalt-term

  # ── Instans-validering av utgjevar-URI ────────────────────────────────────────
  # Repo-intern kjende-utgivar-liste — ikkje frå spesifikasjonen. Ingen spec_url.

  utgjevar_er_kjend_org:
    severity: error
    description: >
      dct:publisher-verdien i instansen må vere ein URI på formatet
      https://data.norge.no/organizations/<9-sifra orgnr> og liggje
      i lista over kjente utgivarar.
    check: instance_slot_uri_pattern
    slot_uri: dct:publisher
    pattern: "^https://data\\.norge\\.no/organizations/\\d{9}$"
    known_values:
      - https://data.norge.no/organizations/974760673
