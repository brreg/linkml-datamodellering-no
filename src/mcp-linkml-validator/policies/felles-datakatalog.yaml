version: 1
extends: bronze

description: >
  Policy for modellkatalogskjema som skal publiserast til Felles Datakatalog.
  Validerer at skjemaet importerer ModelDCAT-AP-NO og eksponerer dei nødvendige
  klassane og slotsa via containerklassen (tree_root).
  Arvar bronselaget: grunnleggande metadata- og modelleringskrav.

required:
  schema: [id, name]
  class: []
  slot: []

recommended:
  schema: [description, title, version]
  class: []
  slot: []

checks:

  # ── Import-krav ─────────────────────────────────────────────────────────────
  # Repo-krav — LinkML-teknisk føresetnad for å uttrykke vokabularet,
  # ikkje eit eige punkt i sjølve spesifikasjonsteksten. Ingen spec_url.

  schema_importerer_modelldcat_ap_no:
    severity: error
    description: >
      Skjemaet må importere modelldcat-ap-no-schema (direkte eller transitivt).
    check: schema_imports
    must_import: modelldcat-ap-no-schema
    characteristic_class: Modellkatalog

  # ── Prefiks-krav ─────────────────────────────────────────────────────────────

  schema_brukar_dct_prefix:
    severity: error
    description: >
      Skjemaet må deklarere dct:-prefikset (Dublin Core Terms).
    check: schema_declares_standard_prefix
    standard_prefixes: [dct]
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Navnerom

  schema_brukar_dcat_prefix:
    severity: error
    description: >
      Skjemaet må deklarere dcat:-prefikset.
    check: schema_declares_standard_prefix
    standard_prefixes: [dcat]
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Navnerom

  # ── Containerklasse-krav ─────────────────────────────────────────────────────
  # Repo-konvensjon (tree_root-mønster) — spec_url peikar til klassen sin
  # generelle omtale for kontekst, ikkje til eit normativt containerkrav.

  container_har_modellkatalog:
    severity: error
    description: >
      Containerklassen (tree_root) må ha eit attributt med range Modellkatalog.
    check: container_has_class
    class: Modellkatalog
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog

  container_har_informasjonsmodell:
    severity: error
    description: >
      Containerklassen må ha eit attributt med range Informasjonsmodell.
    check: container_has_class
    class: Informasjonsmodell
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell

  # ── Modellkatalog-krav (dcat:Catalog) — obligatoriske ─────────────────────────

  modellkatalog_har_tittel:
    severity: error
    description: Modellkatalog må ha dct:title. Obligatorisk i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: dct:title
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-tittel

  modellkatalog_har_beskrivelse:
    severity: error
    description: Modellkatalog må ha dct:description. Obligatorisk i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: dct:description
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-beskrivelse

  modellkatalog_har_utgjevar:
    severity: error
    description: Modellkatalog må ha dct:publisher. Obligatorisk i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: dct:publisher
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-utgiver

  modellkatalog_har_kontaktpunkt:
    severity: error
    description: Modellkatalog må ha dcat:contactPoint. Obligatorisk i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: dcat:contactPoint
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-kontaktpunkt

  modellkatalog_har_del:
    severity: error
    description: Modellkatalog må ha dct:hasPart. Obligatorisk i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: dct:hasPart
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-har-del

  # ── Modellkatalog-krav — anbefalte ─────────────────────────────────────────────

  modellkatalog_har_identifikator:
    severity: warning
    description: >
      Modellkatalog bør ha dct:identifier. Anbefalt i ModelDCAT-AP-NO —
      spesifikasjonen presiserer eksplisitt (kap. 4.4) at dct:identifier medvite
      er sett som anbefalt, ikkje obligatorisk, sidan instansen alt får ein
      «innebygd» identifikator (URI-en/subjektet i RDF-triplet).
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: dct:identifier
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-identifikator

  modellkatalog_har_lisens:
    severity: warning
    description: Modellkatalog bør ha dct:license. Anbefalt i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: dct:license
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-lisens

  modellkatalog_har_modell:
    severity: warning
    description: >
      Modellkatalog bør ha modelldcatno:model (liste over informasjonsmodellar).
      Anbefalt i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Modellkatalog
    slot_uri: modelldcatno:model
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Modellkatalog-modell

  # ── Informasjonsmodell-krav — obligatoriske ───────────────────────────────────

  informasjonsmodell_har_tittel:
    severity: error
    description: Informasjonsmodell må ha dct:title. Obligatorisk i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: dct:title
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-tittel

  informasjonsmodell_har_utgjevar:
    severity: error
    description: >
      Informasjonsmodell må ha dct:publisher. Obligatorisk i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: dct:publisher
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-utgiver

  informasjonsmodell_har_kontaktpunkt:
    severity: error
    description: >
      Informasjonsmodell må ha dcat:contactPoint. Obligatorisk i ModelDCAT-AP-NO
      (multiplisitet 1..n) — retta frå tidlegare warning, sjå
      specs/done/kjeldehenvisning-felles-katalog-policyar.md.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: dcat:contactPoint
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-kontaktpunkt

  # ── Informasjonsmodell-krav — anbefalte ───────────────────────────────────────

  informasjonsmodell_har_beskrivelse:
    severity: warning
    description: Informasjonsmodell bør ha dct:description. Anbefalt i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: dct:description
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-beskrivelse

  informasjonsmodell_har_identifikator:
    severity: warning
    description: Informasjonsmodell bør ha dct:identifier. Anbefalt i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: dct:identifier
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-identifikator

  informasjonsmodell_har_modellidentifikator:
    severity: warning
    description: >
      Informasjonsmodell bør ha modelldcatno:informationModelIdentifier.
      Anbefalt i ModelDCAT-AP-NO — peikar til maskinlesbar modell-URL.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: modelldcatno:informationModelIdentifier
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-informasjonsmodellidentifikator

  informasjonsmodell_har_lisens:
    severity: warning
    description: Informasjonsmodell bør ha dct:license. Anbefalt i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: dct:license
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-lisens

  informasjonsmodell_har_tema:
    severity: warning
    description: Informasjonsmodell bør ha dcat:theme (LOS-tema). Anbefalt i ModelDCAT-AP-NO.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: dcat:theme
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-tema

  informasjonsmodell_har_modellelement:
    severity: warning
    description: >
      Informasjonsmodell bør ha modelldcatno:containsModelElement.
      Anbefalt i ModelDCAT-AP-NO — lister innhaldselementa i modellen.
    check: merged_class_has_slot_with_uri
    class: Informasjonsmodell
    slot_uri: modelldcatno:containsModelElement
    spec_url: https://data.norge.no/specification/modelldcat-ap-no#Informasjonsmodell-inneholder-modellelement

instance_checks:

  # ── Instans-validering av utgjevar-URI ────────────────────────────────────────
  # Repo-intern kjende-utgivar-liste — ikkje frå spesifikasjonen. Ingen spec_url.

  utgjevar_er_kjend_org:
    severity: error
    description: >
      dct:publisher-verdien i instansen må vere ein URI på formatet
      https://data.norge.no/organizations/<9-sifra orgnr> og liggje
      i lista over kjente utgivarar.
    check: instance_slot_uri_pattern
    slot_uri: dct:publisher
    pattern: "^https://data\\.norge\\.no/organizations/\\d{9}$"
    known_values:
      - https://data.norge.no/organizations/974760673
      - https://data.norge.no/organizations/991825827
      - https://data.norge.no/organizations/971040238
      - https://data.norge.no/organizations/974761076
      - https://data.norge.no/organizations/971032146
      - https://data.norge.no/organizations/985870714
