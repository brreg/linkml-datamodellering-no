version: 1
extends: silver

description: >
  FAIR-policy for LinkML-skjema. Sjekkar at skjemaet følgjer FAIR-prinsippa
  (Findable, Accessible, Interoperable, Reusable) for opne offentlege data.
  Arvar sølvlaget (ap-no) og bronselaget (default).
  Alle brot gir feil — gullstatus er krevjande å oppnå.

# Standard felt-sjekkar (lik default)
required:
  schema: [id, name]
  class: []
  slot: []

recommended:
  schema: [description]
  class: [description]
  slot: [description]

common_classes:
  must_use: []

# Oppgrader bronze-åtvarslane til feil på gullnivå.
# _merge_policies slår saman checks frå parent og child med {**parent, **child},
# slik at child-nøklar overstyrer parent-nøklar med same navn.
checks:
  all_classes_have_class_uri:
    severity: error
    description: >
      Alle klasser (unntatt tree_root) skal ha class_uri som mappar klassen til
      eit standard RDF-vokabular. Krev: ikkje berre anbefalt (bronze-nivå).
    check: all_classes_have_class_uri
    digdir_rule: 4, 8
    fair_principle: F3

  all_slots_have_slot_uri:
    severity: error
    description: >
      Alle globale slots skal ha slot_uri som mappar eigenskapen til
      eit standard RDF-vokabular. Krev: ikkje berre anbefalt (bronze-nivå).
    check: all_slots_have_slot_uri
    digdir_rule: 4, 8
    fair_principle: I1

  schema_has_license:
    severity: error
    description: >
      schema.license skal vere til stades med URI til ein open lisens
      (t.d. CC BY 4.0). Støttar Digdir-regel 7 (Tilgjengeliggjøring) om at
      modellen skal vere fritt tilgjengeleg. Krev: ikkje berre anbefalt (bronze-nivå).
    check: schema_field_present
    field: license
    digdir_rule: 7
    fair_principle: R1.1

  class_names_pascal_case:
    severity: error
    description: >
      Klassenavn skal starte med stor forbokstav (PascalCase). Følgjer
      Digdir-regel 3 (Navne- og skrivekonvensjoner) og gjer klasser
      skiljbare frå slot- og attributtnavn. Krev: ikkje berre anbefalt (bronze-nivå).
    check: class_names_pascal_case
    digdir_rule: 3

  slot_names_snake_case:
    severity: error
    description: >
      Slotnavn skal bruke liten forbokstav og understrek (snake_case): berre a-z,
      0-9 og _ er tillate. Bindestreker er ikkje tillate — bruk samansette ord
      (t.d. epost, epostadresse) eller understrek. Følgjer Digdir-regel 3
      (Navne- og skrivekonvensjoner). Krev: ikkje berre anbefalt (bronze-nivå).
    check: slot_names_snake_case
    exclude_schemas:
      - fint-administrasjon
      - fint-arkiv
      - fint-common
      - fint-okonomi
      - fint-personvern
      - fint-ressurs
      - fint-utdanning
    digdir_rule: 3

  all_classes_have_identifier:
    severity: error
    description: >
      Alle klasser (unntatt tree_root) skal ha ein global identifikator — ein slot
      med identifier: true (eigen eller arva). Sikrar at instansar kan adresserast
      med URI i koblede data. Krev: ikkje berre anbefalt (bronze-nivå).
    check: all_classes_have_identifier
    digdir_rule: 4
    fair_principle: F1

  class_count_limit:
    severity: error
    description: >
      Skjema med fleire enn 50 klasser (unntatt tree_root) skal delast opp i
      undermoduler for å halde modellen handterleg. Støttar Digdir-regel 6
      (Modularitet) om handterleg mengd modellelement per modul. Krev: ikkje
      berre anbefalt (bronze-nivå).
    check: class_count
    max_classes: 50
    digdir_rule: 6

  all_classes_have_concept_ref:
    severity: error
    description: >
      Alle klasser (unntatt tree_root) skal ha annotations.begrepsidentifikator
      som peikar på eit begrep i Felles begrepskatalog på forma
      https://concept-catalog.fellesdatakatalog.digdir.no/collections/<collection-id>/concepts/<concept-id>.
      Sikrar omgrepsforankring og semantisk interoperabilitet. Krev: ikkje berre
      anbefalt (bronze-nivå).
    check: all_classes_have_concept_ref
    concept_catalog_uri: https://concept-catalog.fellesdatakatalog.digdir.no/collections
    digdir_rule: 13
    fair_principle: A2

  controlled_vocabulary_annotations:
    severity: error
    description: >
      Slots som refererer til kontrollerte vokabular (annotations.gyldige_verdier)
      skal ha annotations.vokabular_krav (skal|bør|kan), og description skal innehalde
      SKAL/BØR/KAN-formulering som matcher vokabular_krav. Sikrar konsistent og
      maskinlesbar dokumentasjon av vokabularkrav. Krev: ikkje berre anbefalt
      (bronze-nivå).
    check: controlled_vocabulary_annotations

  schema_has_annotation_utgiver:
    severity: error
    description: >
      schema.annotations.utgiver skal vere til stades med URI til ansvarleg
      organisasjon (https://data.norge.no/organizations/<orgnr>).
      Svarar til Informasjonsmodell.utgiver (dct:publisher) i ModelDCAT-AP-NO.
      Digdir-regel 10: Ansvar. Krev: ikkje berre anbefalt (sølv-nivå).
    check: schema_has_annotation
    annotation: utgiver
    value_pattern: "^https://data\\.norge\\.no/organizations/\\d+$"
    digdir_rule: 10
    fair_principle: R1.2

  schema_has_annotation_endringsdato:
    severity: error
    description: >
      schema.annotations.endringsdato skal vere til stades (ISO 8601-dato).
      Svarar til Informasjonsmodell.endringsdato (dct:modified) i ModelDCAT-AP-NO.
      Digdir-regel 9: Datering. Krev: ikkje berre anbefalt (sølv-nivå).
    check: schema_has_annotation
    annotation: endringsdato
    digdir_rule: 9
    fair_principle: R1.3

  schema_has_annotation_oppdateringsfrekvens:
    severity: error
    description: >
      schema.annotations.oppdateringsfrekvens skal vere til stades med ein URI frå
      EU sin Frequency Named Authority List (publications.europa.eu). Svarar til
      dct:accrualPeriodicity. Digdir-rettleiar for åpne data, punkt 6: Oppdaterte data —
      verksemda skal vere tydeleg på oppdateringsfrekvens. Krev: ikkje berre anbefalt
      (sølv-nivå).
    check: schema_has_annotation
    annotation: oppdateringsfrekvens
    value_pattern: "^http://publications\\.europa\\.eu/resource/authority/frequency/.+$"
    digdir_rule: 9
    fair_principle: R1.3

  schema_has_annotation_status:
    severity: error
    description: >
      schema.annotations.status skal vere til stades med ein ADMS Status-URI.
      Svarar til Informasjonsmodell.status (adms:status) i ModelDCAT-AP-NO.
      Digdir-regel 11: Modellstatus. Krev: ikkje berre anbefalt (sølv-nivå).
    check: schema_has_annotation
    annotation: status
    allowed_values:
      - http://purl.org/adms/status/UnderDevelopment
      - http://purl.org/adms/status/Completed
      - http://purl.org/adms/status/Deprecated
      - http://purl.org/adms/status/Withdrawn
    digdir_rule: 11
    fair_principle: R1.3

  distribusjon_lisens:
    principle: Retningslinjer ved tilgjengeliggjøring av offentlige data
    severity: error
    description: >
      dcat:Distribution skal ha dct:license (lisens) for offentlege data.
      Anbefalt, ikkje obligatorisk, i DCAT-AP-NO 2. Krev: ikkje berre anbefalt
      (sølv-nivå).
    check: class_has_slot_with_uri
    class: Distribusjon
    slot_uri: dct:license
    digdir_rule: 7
    fair_principle: R1.1

  datasett_tilgangsrettigheter:
    principle: DCAT-AP-NO
    severity: error
    description: >
      dcat:Dataset skal ha dct:accessRights (tilgangsrettar). Anbefalt, ikkje
      obligatorisk, i DCAT-AP-NO 2. Krev: ikkje berre anbefalt (sølv-nivå).
      Svarar til trafikklyssystemet (grøn/gul/raud) i Digdir sin veileder
      «Orden i eget hus», steg 4 — vurdere tilgangsnivå.
    check: class_has_slot_with_uri
    class: Datasett
    slot_uri: dct:accessRights

  datasett_lovgivning:
    principle: DCAT-AP-NO
    severity: error
    description: >
      dcat:Dataset skal ha dcatap:applicableLegislation (gjeldande lovgjeving).
      Anbefalt, ikkje obligatorisk, i DCAT-AP-NO 2. Krev: ikkje berre anbefalt
      (sølv-nivå). Svarar til lovheimel-kravet i Digdir sin veileder
      «Orden i eget hus», steg 4 — vurdere tilgangsnivå.
    check: class_has_slot_with_uri
    class: Datasett
    slot_uri: dcatap:applicableLegislation

  container_distribusjon:
    principle: DCAT-AP-NO
    severity: error
    description: >
      Containerklassen skal ha eit attributt med range Distribusjon
      (dcat:Distribution). Anbefalt i DCAT-AP-NO 2. Krev: ikkje berre anbefalt
      (sølv-nivå).
    check: container_has_class
    class: Distribusjon

  container_datatjeneste:
    principle: DCAT-AP-NO
    severity: error
    description: >
      Containerklassen skal ha eit attributt med range Datatjeneste
      (dcat:DataService). Anbefalt i DCAT-AP-NO 2. Krev: ikkje berre anbefalt
      (sølv-nivå).
    check: container_has_class
    class: Datatjeneste

  container_kvalitetsdimensjon:
    principle: DQV-AP-NO
    severity: error
    description: >
      Containerklassen skal ha eit attributt med range Kvalitetsdimensjon
      (dqv:Dimension). Anbefalt i DQV-AP-NO. Krev: ikkje berre anbefalt (sølv-nivå).
    check: container_has_class
    class: Kvalitetsdimensjon

  container_kvalitetsmerknad:
    principle: DQV-AP-NO
    severity: error
    description: >
      Containerklassen skal ha eit attributt med range Kvalitetsmerknad
      (dqv:QualityAnnotation). Anbefalt i DQV-AP-NO. Krev: ikkje berre anbefalt
      (sølv-nivå).
    check: container_has_class
    class: Kvalitetsmerknad

  schema_har_erdiagram_aktivert:
    severity: error
    description: >
      build.yaml skal ha generators.erdiagram: true, slik at eit ER-diagram
      vert generert for skjemaet. Digdir-regel 5: Visualisering. Krev: ikkje
      berre anbefalt (bronze-nivå).
    check: build_yaml_generator_flag
    generator: erdiagram
    digdir_rule: 5

  schema_importerer_dqv_ap_no:
    severity: error
    description: >
      Skjemaet skal importere dqv-ap-no-schema (direkte eller transitivt) for
      å gjenbruke kvalitetsvokabularet i staden for å definere eigne
      tilsvarande klassar/slots. Digdir-regel 14: Gjenbruk. Krev: ikkje berre
      anbefalt (sølv-nivå).
    check: schema_imports
    must_import: dqv-ap-no-schema
    characteristic_class: Kvalitetsmaal
    digdir_rule: 14
    fair_principle: I3

  local_types_have_standard_uri:
    severity: error
    description: >
      Lokalt definerte typar (schemaets eige types:-felt) skal oppgje ein
      uri: mot eit standardisert namnerom (xsd/rdf/rdfs/owl). Digdir-regel 15:
      Standardiserte datatyper. Krev: ikkje berre anbefalt (bronze-nivå).
    check: local_types_have_standard_uri
    digdir_rule: 15
    fair_principle: I1

# FAIR-sjekkar — alle brot gir feil (severity: error)
# Kvar sjekk er ein dict med:
#   principle   — FAIR-prinsipp (F1, F2, I1, R1.1, …)
#   severity    — error (alle krav på gullnivå)
#   description — kva sjekken validerer (lesbar utan å sjå i server.py)
#   check       — type sjekk (bestemmer kva funksjon som køyrast i server.py)
#   + eventuelle parametrar som check-funksjonen brukar
#
# Merk: F1 (schema_id_is_http_uri), F3 (all_classes_have_class_uri) og
# I1 (all_slots_have_slot_uri) er flytta til bronze.yaml og arva herifrå.
# Dei er oppgradert til error via checks-blokka ovanfor.
fair_checks:

  # F — Findable

  f2_title:
    principle: F2
    severity: error
    description: >
      schema.title skal vere sett. Tittel er ein del av rike metadata
      som gjer ressursen søkbar i katalogar.
    check: schema_field_present
    field: title
    digdir_rule: 1, 2
    fair_principle: F2

  f4_version:
    principle: F4
    severity: error
    description: >
      schema.version skal vere sett. Versjonering støttar katalogregistrering
      og sporbarheit av endringar over tid.
    check: schema_field_present
    field: version
    digdir_rule: 9
    fair_principle: F4

  # I — Interoperable

  i2_standard_prefixes:
    principle: I2
    severity: error
    description: >
      Skjemaet skal deklarere minst eitt standard vokabularprefiks.
      Standardvokabular sikrar interoperabilitet på tvers av system.
    check: schema_declares_standard_prefix
    standard_prefixes: [dct, dcat, skos, prov, rdf, rdfs, owl, foaf, xsd]
    digdir_rule: 8
    fair_principle: I2

  # R — Reusable

  r11_license:
    principle: R1.1
    severity: error
    description: >
      Skjemaet skal ha ein slot med dct:license som angir lisensinformasjon.
      Lisens er ein føresetnad for at data kan brukast på nytt av andre.
    check: schema_has_slot_with_uri
    match_any_uri:
      - dct:license
      - http://purl.org/dc/terms/license
    digdir_rule: 7
    fair_principle: R1.1

  r12_provenance:
    principle: R1.2
    severity: error
    description: >
      Skjemaet skal ha ein slot for proveniensinformasjon — opphav, opphavar
      eller utgjevar. Proveniens er viktig for tillit til og gjenbruk av data.
    check: schema_has_slot_with_uri
    match_any_uri:
      - prov:wasAttributedTo
      - prov:wasGeneratedBy
      - dct:creator
      - dct:publisher
      - dct:contributor
      - http://www.w3.org/ns/prov#wasAttributedTo
      - http://www.w3.org/ns/prov#wasGeneratedBy
      - http://purl.org/dc/terms/creator
      - http://purl.org/dc/terms/publisher
      - http://purl.org/dc/terms/contributor
    digdir_rule: 10
    fair_principle: R1.2
