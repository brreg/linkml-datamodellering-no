id: https://data.norge.no/linkml/referansemodell
name: referansemodell-schema
title: Referansemodell
description: Enkel eksempelmodell for å demonstrere gyldig LinkML-struktur
version: "1.5.0"
license: https://data.norge.no/nlod/no/2.0
annotations:
  utgiver: https://data.norge.no/organizations/974760673
  endringsdato: "2026-08-25"
  utgivelsesdato: "2026-07-09"
  status: http://purl.org/adms/status/UnderDevelopment
# Importer alltid frå eit AP-NO-profil — ikkje linkml:types direkte.
# AP-NO-profilane arvar sjølve frå common-ap-no (typar, subsets og gjenbrukbare slots).
imports:
  - linkml:types
  - ../../ap-no/dcat-ap-no/dcat-ap-no-schema
prefixes:
  linkml: https://w3id.org/linkml/
  ex: https://data.norge.no/linkml/referansemodell/vocab#
  dct: http://purl.org/dc/terms/
default_prefix: https://data.norge.no/linkml/referansemodell/
default_range: string
# Subsets (Obligatorisk, Anbefalt, Valgfri) er arva frå common-ap-no via dcat-ap-no-import.
# Desse treng ikkje definerast på nytt her.
classes:
  # Containerklassen er inngangspunktet for validering og serialisering.
  # tree_root: true — éin per skjema, treng ikkje class_uri.
  # Attributtane skrives alltid i fleirtal.
  ReferanseContainer:
    description: Samling av ressursar — toppnivåobjekt for datafila.
    tree_root: true
    attributes:
      ressursar:
        description: Ressursane som inngår i datafila.
        range: Ressurs
        multivalued: true
        inlined: true
        inlined_as_list: true
  # Domenemodellklasser skal alltid ha class_uri som peikar til riktig RDF-vokabular.
  # annotations.begrepsidentifikator kobler klassen til Felles begrepskatalog.
  Ressurs:
    description: Ein generisk ressurs med tittel, skildring og utgjevar.
    class_uri: dct:BibliographicResource
    # annotations.begrepsidentifikator brukar TODO-placeholder inntil klassen
    # har ei reell begrepsdefinisjon i Felles begrepskatalog.
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id
      - tittel
      - beskrivelse
      - utgjevar
    slot_usage:
      # required: true setjast alltid i slot_usage på klassen — ikkje i den globale slotdefinisjonen.
      tittel:
        required: true
        in_subset:
          - Obligatorisk
      beskrivelse:
        in_subset:
          - Anbefalt
      utgjevar:
        in_subset:
          - Anbefalt
slots:
  # id, tittel, beskrivelse er arva frå common-ap-no (via dcat-ap-no-import).
  # Desse treng ikkje definerast på nytt her.
  # Berre modell-spesifikke slots skal definerast under.

  # Referansar til andre ressursar (f.eks. organisasjonar) brukast som URI-ar,
  # ikkje som inlina objekt — sjølv om Organisasjon finst som klasse andre stader.
  utgjevar:
    description: Organisasjon ansvarleg for ressursen (referert med URI).
    slot_uri: dct:publisher
    range: uriorcurie
# Container-slots skal alltid vere multivalued + inlined_as_list: true.
# inlined: true + inlined_as_list: true → serialisert som YAML-liste, ikkje objekt.
