##
## Referansemodell — sølvnivå
## Viser minstekrava for å bestå sølvpolicyen (bronze + DCAT-AP-NO + DQV-AP-NO).
## Run: make mcp-linkml-valider-modell SCHEMA=src/linkml/referanse/referansemodell-silver/referansemodell-silver-schema.yaml POLICY=silver
##

id: https://data.norge.no/linkml/referansemodell-silver
name: referansemodell-silver
title: Referansemodell - sølvnivå
description: >-
  Viser minstekrava for å bestå sølvpolicyen: alle bronse-krav pluss
  DCAT-AP-NO og DQV-AP-NO-klasser med påkravde slots og containerklasse.
version: "2.1.1"
license: https://data.norge.no/nlod/no/2.0
annotations:
  utgiver: https://data.norge.no/organizations/974760673
  status: http://purl.org/adms/status/UnderDevelopment
  endringsdato: "2026-09-01"
  utgivelsesdato: "2026-08-23"
  # silver: schema_has_annotation_oppdateringsfrekvens → warning
  oppdateringsfrekvens: http://publications.europa.eu/resource/authority/frequency/IRREG

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  ex:    https://example.org/vocab/
  dct:   http://purl.org/dc/terms/
  dcat:  http://www.w3.org/ns/dcat#
  dcatap: http://data.europa.eu/r5r/
  foaf:  http://xmlns.com/foaf/0.1/
  dqv:   http://www.w3.org/ns/dqv#

default_prefix: https://data.norge.no/linkml/referansemodell-silver/
default_range: string

subsets:
  Obligatorisk:
    description: Felt som er obligatoriske i henhold til sølvpolicyen.
  Anbefalt:
    description: Felt som er anbefalte, men ikkje påkravde, i henhold til sølvpolicyen.
  Valgfri:
    description: Felt som er valfrie i henhold til sølvpolicyen.

classes:

  # silver: container_katalog, container_datasett, container_kvalitetsmaal,
  #         container_kvalitetsmaaling → error
  # silver: container_distribusjon, container_datatjeneste,
  #         container_kvalitetsdimensjon, container_kvalitetsmerknad → warning
  ReferanseSolvContainer:
    description: Toppnivåobjekt for datafila — samlar alle AP-NO- og DQV-AP-NO-entitetar.
    tree_root: true
    attributes:
      katalogar:
        description: Katalogane som inngår i datafila.
        range: Katalog
        multivalued: true
        inlined: true
        inlined_as_list: true
      katalogpostar:
        description: Katalogpostane som inngår i datafila.
        range: Katalogpost
        multivalued: true
        inlined: true
        inlined_as_list: true
      datasett:
        description: Datasetta som inngår i datafila.
        range: Datasett
        multivalued: true
        inlined: true
        inlined_as_list: true
      distribusjoner:
        description: Distribusjonane som inngår i datafila.
        range: Distribusjon
        multivalued: true
        inlined: true
        inlined_as_list: true
      datatenestar:
        description: Datatenestane som inngår i datafila.
        range: Datatjeneste
        multivalued: true
        inlined: true
        inlined_as_list: true
      aktorar:
        description: Aktørane som inngår i datafila.
        range: Aktor
        multivalued: true
        inlined: true
        inlined_as_list: true
      kvalitetsmaal:
        description: Kvalitetsmåla som inngår i datafila.
        range: Kvalitetsmaal
        multivalued: true
        inlined: true
        inlined_as_list: true
      kvalitetsmaalingar:
        description: Kvalitetsmålingane som inngår i datafila.
        range: Kvalitetsmaaling
        multivalued: true
        inlined: true
        inlined_as_list: true
      kvalitetsdimensjonar:
        description: Kvalitetsdimensjonane som inngår i datafila.
        range: Kvalitetsdimensjon
        multivalued: true
        inlined: true
        inlined_as_list: true
      kvalitetsmerknader:
        description: Kvalitetsmerknadene som inngår i datafila.
        range: Kvalitetsmerknad
        multivalued: true
        inlined: true
        inlined_as_list: true

  # silver: katalog_tittel, katalog_beskrivelse, katalog_kontaktpunkt,
  #         katalog_utgiver → error (class_has_slot_with_uri)
  Katalog:
    description: Samling av datasett, datatenestar og distribusjonar.
    class_uri: dcat:Catalog
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id
      - tittel
      - skildring
      - kontaktpunkt
      - utgjevar
    slot_usage:
      tittel:
        required: true
        in_subset: [Obligatorisk]
      skildring:
        required: true
        in_subset: [Obligatorisk]
      kontaktpunkt:
        required: true
        in_subset: [Obligatorisk]
      utgjevar:
        required: true
        in_subset: [Obligatorisk]

  # silver: katalogpost_endringsdato, katalogpost_primaertema → error
  Katalogpost:
    description: Oppføring i ein katalog som skildrar ein ressurs.
    class_uri: dcat:CatalogRecord
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id
      - endringsdato
      - primaertema
    slot_usage:
      endringsdato:
        required: true
        in_subset: [Obligatorisk]
      primaertema:
        required: true
        in_subset: [Obligatorisk]

  # silver: datasett_tittel, datasett_beskrivelse, datasett_kontaktpunkt,
  #         datasett_utgiver, datasett_tema → error
  # silver: datasett_tilgangsrettigheter, datasett_lovgivning → warning
  Datasett:
    description: Ei samling av data, utgitt eller kuratert av ei einskild kjelde.
    class_uri: dcat:Dataset
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id
      - tittel
      - skildring
      - kontaktpunkt
      - utgjevar
      - tema
      - tilgangsrettigheter
      - gjeldende_lovgivning
    slot_usage:
      tittel:
        required: true
        in_subset: [Obligatorisk]
      skildring:
        required: true
        in_subset: [Obligatorisk]
      kontaktpunkt:
        required: true
        in_subset: [Obligatorisk]
      utgjevar:
        required: true
        in_subset: [Obligatorisk]
      tema:
        required: true
        in_subset: [Obligatorisk]
      tilgangsrettigheter:
        in_subset: [Anbefalt]
      gjeldende_lovgivning:
        in_subset: [Anbefalt]

  # silver: distribusjon_tilgangsurl → error
  # silver: distribusjon_lisens → warning
  Distribusjon:
    description: Ei spesifikk representasjon av eit datasett.
    class_uri: dcat:Distribution
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id
      - tilgangsurl
      - lisens
    slot_usage:
      tilgangsurl:
        required: true
        in_subset: [Obligatorisk]
      lisens:
        in_subset: [Anbefalt]

  # silver: datatjeneste_endepunktsurl, datatjeneste_kontaktpunkt,
  #         datatjeneste_tittel, datatjeneste_utgiver → error
  Datatjeneste:
    description: Ei samling av operasjonar som gir tilgang til data via eit grensesnitt.
    class_uri: dcat:DataService
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id
      - tittel
      - kontaktpunkt
      - utgjevar
      - endepunktsurl
    slot_usage:
      tittel:
        required: true
        in_subset: [Obligatorisk]
      kontaktpunkt:
        required: true
        in_subset: [Obligatorisk]
      utgjevar:
        required: true
        in_subset: [Obligatorisk]
      endepunktsurl:
        required: true
        in_subset: [Obligatorisk]

  # silver: aktor_navn → error
  Aktor:
    description: Ein aktør (person, organisasjon eller programvaresystem).
    class_uri: foaf:Agent
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id
      - navn
    slot_usage:
      navn:
        required: true
        in_subset: [Obligatorisk]

  # silver: container_kvalitetsmaal → error
  Kvalitetsmaal:
    description: Eit mål for å evaluere kvaliteten til ein ressurs.
    class_uri: dqv:Metric
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id

  # silver: container_kvalitetsmaaling → error
  Kvalitetsmaaling:
    description: Resultat av å evaluere eit datasett mot eit kvalitetsmål.
    class_uri: dqv:QualityMeasurement
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id

  # silver: container_kvalitetsdimensjon → warning
  Kvalitetsdimensjon:
    description: Ein kategori av kvalitetsegenskapar for data.
    class_uri: dqv:Dimension
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id

  # silver: container_kvalitetsmerknad → warning
  Kvalitetsmerknad:
    description: Ei kvalitetsvurdering av ein ressurs.
    class_uri: dqv:QualityAnnotation
    annotations:
      begrepsidentifikator: https://concept-catalog.fellesdatakatalog.digdir.no/collections/TODO/concepts/TODO
    slots:
      - id

slots:

  # bronze: identifier: true → all_classes_have_identifier
  id:
    description: Unik URI-identifikator.
    identifier: true
    range: uriorcurie
    slot_uri: dct:identifier

  # Delt slot — Katalog, Datasett, Datatjeneste: silver katalog_tittel,
  #   datasett_tittel, datatjeneste_tittel (dct:title)
  tittel:
    description: Navn eller tittel.
    slot_uri: dct:title
    range: string

  # Delt slot — Katalog, Datasett: silver katalog_beskrivelse,
  #   datasett_beskrivelse (dct:description)
  skildring:
    description: Kortfatta skildring.
    slot_uri: dct:description
    range: string

  # Delt slot — Katalog, Datasett, Datatjeneste: silver katalog_kontaktpunkt,
  #   datasett_kontaktpunkt, datatjeneste_kontaktpunkt (dcat:contactPoint)
  kontaktpunkt:
    description: Kontaktinformasjon for ressursen.
    slot_uri: dcat:contactPoint
    range: uriorcurie

  # Delt slot — Katalog, Datasett, Datatjeneste: silver katalog_utgiver,
  #   datasett_utgiver, datatjeneste_utgiver (dct:publisher)
  utgjevar:
    description: Organisasjon ansvarleg for ressursen.
    slot_uri: dct:publisher
    range: uriorcurie

  # Katalogpost: silver katalogpost_endringsdato (dct:modified)
  endringsdato:
    description: Dato for siste endring.
    slot_uri: dct:modified
    range: date

  # Katalogpost: silver katalogpost_primaertema (foaf:primaryTopic)
  primaertema:
    description: Ressursen som katalogposten omhandlar.
    slot_uri: foaf:primaryTopic
    range: uriorcurie

  # Datasett: silver datasett_tema (dcat:theme)
  tema:
    description: Hovudkategori for datasettet.
    slot_uri: dcat:theme
    range: uriorcurie

  # Distribusjon: silver distribusjon_tilgangsurl (dcat:accessURL)
  tilgangsurl:
    description: URL for å få tilgang til datasettet.
    slot_uri: dcat:accessURL
    range: uriorcurie

  # Datatjeneste: silver datatjeneste_endepunktsurl (dcat:endpointURL)
  endepunktsurl:
    description: URL til rotplasseringa av endepunktet.
    slot_uri: dcat:endpointURL
    range: uriorcurie

  # Aktør: silver aktor_navn (foaf:name)
  navn:
    description: Navn på aktøren.
    slot_uri: foaf:name
    range: string

  # Datasett: silver datasett_tilgangsrettigheter (dct:accessRights)
  tilgangsrettigheter:
    description: Tilgangsnivå for datasettet.
    slot_uri: dct:accessRights
    range: uriorcurie

  # Datasett: silver datasett_lovgivning (dcatap:applicableLegislation)
  gjeldende_lovgivning:
    description: Gjeldande lovgjeving (lovheimel) for tilgang til ressursen.
    slot_uri: dcatap:applicableLegislation
    range: uriorcurie
    multivalued: true

  # Distribusjon: silver distribusjon_lisens (dct:license)
  lisens:
    description: Lisens som regulerer bruken av ressursen.
    slot_uri: dct:license
    range: uriorcurie

  # Containerslots — silver container_has_class-sjekkar (error/warning)
