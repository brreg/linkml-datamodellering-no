beskrivelse:
  nb: Gjenbrukbare primitivtypar utleia frå Brønnøysundregistrene (BR) sin interne
    Løsningstypekatalog_v1 (MagicDraw/XMI). Skjemaet er den felles kjelda for typar
    som elles vart lokalt (og inkonsistent) redefinert i kvart av dei sju enhetsregisteret-*-skjemaa,
    jf. specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md. Berre denne
    kjeldekatalogen ("Løsningsmodell"-laget hos BR) er brukt her — BRReferansemodell_v3
    sitt eige, arva typelag i Strukturtypekatalog_v1 er eit separat, ikkje-importert
    lag (sjå nemnde spec, Funn 3).
  nn: Gjenbrukbare primitivtypar utleia frå Brønnøysundregistrene (BR) sin interne
    Løsningstypekatalog_v1 (MagicDraw/XMI). Skjemaet er den felles kjelda for typar
    som elles vart lokalt (og inkonsistent) redefinert i kvart av dei sju enhetsregisteret-*-skjemaa,
    jf. specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md. Berre denne
    kjeldekatalogen ("Løsningsmodell"-laget hos BR) er brukt her — BRReferansemodell_v3
    sitt eige, arva typelag i Strukturtypekatalog_v1 er eit separat, ikkje-importert
    lag (sjå nemnde spec, Funn 3).
