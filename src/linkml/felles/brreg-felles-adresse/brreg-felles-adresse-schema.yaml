id: https://data.norge.no/felles/brreg-felles-adresse
name: brreg-felles-adresse
title: BRREG felles adresse
description: >-
  Gjenbrukbare adresseklassar utleia frå Brønnøysundregistrene (BR) sin
  interne BRReferansemodell_v3 (MagicDraw/XMI), pakken "Adresse" — eit
  geografisk adressehierarki (GeografiskAdresse) og eit digitalt
  adressehierarki (DigitalAdresse), pluss dei adresse-relaterte
  komplekstypane frå Strukturtypekatalog_v1 (Poststed, Kommune, Fylke,
  Matrikkelnummer, Adressenummer) som adressehierarkiet er avhengig av.
  Sjå specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md for
  bakgrunn, metode og avklaringane denne modellen byggjer på.

  BR sin eigen `Nettadresse`-undertype "Aksesspunkt" er medvite utelaten
  her: feltet `aksesspunktoperatoer` peikar til `Virksomhet` (definert i
  brreg-felles-aktoer, som importerer denne modellen) og ville gjort
  importgrafen sirkulær. Sjå nemnde spec § Funn 4.

version: "0.1.0"
license: https://data.norge.no/nlod/no/2.0

annotations:
  utgiver: https://data.norge.no/organizations/974760673
  endringsdato: "2026-08-31"
  utgivelsesdato: "2026-08-31"
  status: http://purl.org/adms/status/UnderDevelopment

prefixes:
  linkml: https://w3id.org/linkml/
  brreg_felles_adresse: https://data.norge.no/felles/brreg-felles-adresse/
  locn: http://www.w3.org/ns/locn#
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: https://data.norge.no/felles/brreg-felles-adresse/
default_range: string

imports:
  - linkml:types
  - ../brreg-felles-typer/brreg-felles-typer-schema

# ---------------------------------------------------------------------------
# Klasser
#
# Kjelde: BR BRReferansemodell_v3 (pakken "Adresse") for adresseklassane,
# og Strukturtypekatalog_v1 (pakken "Komplekstyper") for Poststed/Kommune/
# Fylke/Matrikkelnummer/Adressenummer. Felt som i kjelda er typa generisk
# til den abstrakte Strukturtypekatalog-basen "Identifikator" — og som
# ikkje har eit namnelik motstykke i brreg-felles-typer — er forenkla til
# `string` her, med ein TODO-kommentar (jf. avklaring i søsterspecen,
# sidan brreg-felles-struktur-typer ikkje vart oppretta).
# ---------------------------------------------------------------------------

classes:

  GeografiskAdresse:
    class_uri: locn:Address
    description: Ei geografisk adresse. Abstrakt basisklasse for dei konkrete adressetypane under.
    slots:
      - id
      - br_adresse_id
      - co_navn
      - type
    slot_usage:
      br_adresse_id:
        description: BR sin interne identifikator for adressa.
        # TODO: vurder eigen felles-type når/dersom brreg-felles-struktur-typer vert oppretta.
      type:
        description: Diskriminator for kva slag geografisk adresse dette er.

  Postboksadresse:
    is_a: GeografiskAdresse
    class_uri: brreg_felles_adresse:Postboksadresse
    description: Ei postboksadresse.
    slots:
      - postboksnummer
      - anleggsnavn
      - poststed
      - kommune

  Stedsadresse:
    is_a: GeografiskAdresse
    class_uri: brreg_felles_adresse:Stedsadresse
    description: Ei stadfesta adresse utan vegadresse (t.d. i utmark).
    slots:
      - stedsnavn
      - poststed
      - kommune

  Vegadresse:
    is_a: GeografiskAdresse
    class_uri: brreg_felles_adresse:Vegadresse
    description: Ei vegadresse (adressenavn + adressenummer).
    slots:
      - vegadresse_id
      - bruksenhetsnummer
      - adressenavn
      - kort_adressenavn
      - adressenummer
      - poststed
      - adressetilleggsnavn
      - kommune
      - fylke
    slot_usage:
      vegadresse_id:
        description: BR sin interne identifikator for vegadressa.
        # TODO: vurder eigen felles-type når/dersom brreg-felles-struktur-typer vert oppretta.

  Matrikkeladresse:
    is_a: GeografiskAdresse
    class_uri: brreg_felles_adresse:Matrikkeladresse
    description: Ei matrikkeladresse (knytt til eit matrikkelnummer).
    slots:
      - matrikkeladresse_id
      - bruksenhetsnummer
      - adressetilleggsnavn
      - matrikkelnummer
      - undernummer
    slot_usage:
      matrikkeladresse_id:
        description: BR sin interne identifikator for matrikkeladressa.
        # TODO: vurder eigen felles-type når/dersom brreg-felles-struktur-typer vert oppretta.

  InternasjonalAdresse:
    is_a: GeografiskAdresse
    class_uri: brreg_felles_adresse:InternasjonalAdresse
    description: Ei adresse i eit anna land enn Noreg, i fri form.
    slots:
      - adressenavn
      - adressenummer_tekst
      - bygning
      - etasjenummer
      - boenhet
      - postboks
      - postkode
      - by_eller_stedsnavn
      - region
      - distrikt_eller_bydel
      - landkode
      - fri_adressetekst
      - adresseidentifikator
    slot_usage:
      adressenummer_tekst:
        description: Adressenummer som fritekst (ikkje strukturert som Adressenummer-klassen, sidan format varierer mellom land).

  DigitalAdresse:
    class_uri: brreg_felles_adresse:DigitalAdresse
    description: Ei digital adresse. Abstrakt basisklasse for dei konkrete digitale adressetypane under.
    slots:
      - id
      - identifikator
      - type
    slot_usage:
      identifikator:
        description: Identifikator for den digitale adressa (form varierer per undertype).
        # TODO: vurder eigen felles-type når/dersom brreg-felles-struktur-typer vert oppretta.
      type:
        description: Diskriminator for kva slag digital adresse dette er.

  IPAdresse:
    is_a: DigitalAdresse
    class_uri: brreg_felles_adresse:IPAdresse
    description: Ei IP-adresse.
    slots:
      - ip_nummer
    slot_usage:
      ip_nummer:
        description: IP-nummeret.
        # TODO: vurder eigen felles-type når/dersom brreg-felles-struktur-typer vert oppretta.

  EPostadresse:
    is_a: DigitalAdresse
    class_uri: brreg_felles_adresse:EPostadresse
    description: Ei e-postadresse, delt opp i brukarnamn og domenenavn.
    slots:
      - domenenavn
      - brukernavn

  Nettadresse:
    is_a: DigitalAdresse
    class_uri: brreg_felles_adresse:Nettadresse
    description: Ei nettadresse (protokoll, domenenavn og filsti).
    slots:
      - protokoll
      - domenenavn
      - filsti

  Meldingsboks:
    is_a: DigitalAdresse
    class_uri: brreg_felles_adresse:Meldingsboks
    description: Ei digital meldingsboks (t.d. Altinn).
    slots:
      - meldingsbokstype

  Mobiltelefonnummer:
    is_a: DigitalAdresse
    class_uri: brreg_felles_adresse:Mobiltelefonnummer
    description: Eit mobiltelefonnummer.
    slots:
      - prefiks_med_nasjonal_kode
      - nasjonalt_nummer

  Telefonnummer:
    is_a: DigitalAdresse
    class_uri: brreg_felles_adresse:Telefonnummer
    description: Eit fasttelefonnummer.
    slots:
      - prefiks_med_nasjonal_kode
      - nasjonalt_nummer

  # --- Adresse-relaterte komplekstypar frå Strukturtypekatalog_v1 ---

  Poststed:
    class_uri: brreg_felles_adresse:Poststed
    description: Eit poststed knytt til eit postnummer.
    # Kjelde: BR Strukturtypekatalog_v1 (Komplekstyper::Poststed)
    slots:
      - id
      - navn
      - postnummer
    slot_usage:
      navn:
        required: true
      postnummer:
        required: true

  Kommune:
    class_uri: brreg_felles_adresse:Kommune
    description: Ein norsk kommune.
    # Kjelde: BR Strukturtypekatalog_v1 (Komplekstyper::Kommune)
    slots:
      - id
      - kommunenummer
      - kommunenavn
    slot_usage:
      kommunenummer:
        required: true
      kommunenavn:
        required: true

  Fylke:
    class_uri: brreg_felles_adresse:Fylke
    description: Eit norsk fylke.
    # Kjelde: BR Strukturtypekatalog_v1 (Komplekstyper::Fylke)
    slots:
      - id
      - fylkesnummer
      - fylkesnavn
    slot_usage:
      fylkesnummer:
        required: true
      fylkesnavn:
        required: true

  Matrikkelnummer:
    class_uri: brreg_felles_adresse:Matrikkelnummer
    description: Eit matrikkelnummer (gårds-, bruks-, feste- og seksjonsnummer).
    # Kjelde: BR Strukturtypekatalog_v1 (Komplekstyper::Matrikkelnummer)
    slots:
      - id
      - kommunenummer
      - gaardsnummer
      - bruksnummer
      - festenummer
      - seksjonsnummer
    slot_usage:
      kommunenummer:
        required: true
      gaardsnummer:
        required: true
      bruksnummer:
        required: true

  Adressenummer:
    class_uri: brreg_felles_adresse:Adressenummer
    description: Adressenummeret (husnummer og eventuell husbokstav) i ei vegadresse.
    # Kjelde: BR Strukturtypekatalog_v1 (Komplekstyper::Adressenummer)
    slots:
      - id
      - nummer
      - bokstav
    slot_usage:
      nummer:
        required: true

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------

slots:

  id:
    identifier: true
    range: uriorcurie
    description: URI-identifikator for ressursen.

  br_adresse_id:
    slot_uri: brreg_felles_adresse:brAdresseId
    range: string
    description: "BR sin interne identifikator for adressa."

  co_navn:
    slot_uri: brreg_felles_adresse:coNavn
    range: string
    description: "C/O-namn (omsorgsperson/-verksemd) knytt til adressa."

  type:
    slot_uri: brreg_felles_adresse:type
    range: string
    description: "Diskriminator for kva slag adresse dette er."

  postboksnummer:
    slot_uri: brreg_felles_adresse:postboksnummer
    range: Postboksnummer
    description: Nummeret på postboksen.

  anleggsnavn:
    slot_uri: brreg_felles_adresse:anleggsnavn
    range: string
    description: Namnet på anlegget/institusjonen postboksen høyrer til.

  poststed:
    slot_uri: brreg_felles_adresse:poststed
    range: Poststed
    description: "Poststedet adressa høyrer til."

  kommune:
    slot_uri: brreg_felles_adresse:kommune
    range: Kommune
    description: "Kommunen adressa ligg i."

  stedsnavn:
    slot_uri: brreg_felles_adresse:stedsnavn
    range: string
    description: Namnet på staden (for adresser utan vegadresse).

  vegadresse_id:
    slot_uri: brreg_felles_adresse:vegadresseId
    range: string
    description: "BR sin interne identifikator for vegadressa."

  bruksenhetsnummer:
    slot_uri: brreg_felles_adresse:bruksenhetsnummer
    range: Bruksenhetsnummer
    description: 'Bruksenhetsnummer (bustadnummer) i adressa, t.d. "H0101".'

  adressenavn:
    slot_uri: brreg_felles_adresse:adressenavn
    range: string
    description: "Namnet på vegen/gata/staden."

  kort_adressenavn:
    slot_uri: brreg_felles_adresse:kortAdressenavn
    range: string
    description: Forkorta versjon av adressenamnet.

  adressenummer:
    slot_uri: brreg_felles_adresse:adressenummer
    range: Adressenummer
    description: "Husnummer og eventuell husbokstav i vegadressa."

  adressetilleggsnavn:
    slot_uri: brreg_felles_adresse:adressetilleggsnavn
    range: string
    description: "Tilleggsnamn til adressa (t.d. stadnamn i tillegg til vegadresse)."

  fylke:
    slot_uri: brreg_felles_adresse:fylke
    range: Fylke
    description: "Fylket adressa ligg i."

  matrikkeladresse_id:
    slot_uri: brreg_felles_adresse:matrikkeladresseId
    range: string
    description: "BR sin interne identifikator for matrikkeladressa."

  matrikkelnummer:
    slot_uri: brreg_felles_adresse:matrikkelnummer
    range: Matrikkelnummer
    description: "Matrikkelnummeret adressa er knytt til."

  undernummer:
    slot_uri: brreg_felles_adresse:undernummer
    range: integer
    description: Undernummer for seksjonert eigedom.

  adressenummer_tekst:
    slot_uri: brreg_felles_adresse:adressenummerTekst
    range: string
    description: "Adressenummer som fritekst (for utanlandske adresser med anna format enn norsk husnummer/husbokstav)."

  bygning:
    slot_uri: brreg_felles_adresse:bygning
    range: string
    description: "Bygningsnamn eller -nummer."

  etasjenummer:
    slot_uri: brreg_felles_adresse:etasjenummer
    range: string
    description: "Etasjenummer."

  boenhet:
    slot_uri: brreg_felles_adresse:boenhet
    range: string
    description: "Bueining/leilegheitsnummer."

  postboks:
    slot_uri: brreg_felles_adresse:postboks
    range: string
    description: "Postboksnummer (utanlandsk format)."

  postkode:
    slot_uri: brreg_felles_adresse:postkode
    range: string
    description: Utanlandsk postkode (ikkje norsk postnummer).

  by_eller_stedsnavn:
    slot_uri: brreg_felles_adresse:byEllerStedsnavn
    range: string
    description: "By- eller stadnamn."

  region:
    slot_uri: brreg_felles_adresse:region
    range: string
    description: "Region, delstat eller provins."

  distrikt_eller_bydel:
    slot_uri: brreg_felles_adresse:distriktEllerBydel
    range: string
    description: "Distrikt eller bydel."

  landkode:
    slot_uri: brreg_felles_adresse:landkode
    range: Landkode
    description: "Landet adressa ligg i."

  fri_adressetekst:
    slot_uri: brreg_felles_adresse:friAdressetekst
    range: string
    description: "Heile adressa som fritekst, når ho ikkje kan strukturerast i felta over."

  adresseidentifikator:
    slot_uri: brreg_felles_adresse:adresseidentifikator
    range: string
    description: "Ein ekstern identifikator for adressa (t.d. frå eit utanlandsk adresseregister)."

  identifikator:
    slot_uri: brreg_felles_adresse:identifikator
    range: string
    description: >-
      Generisk identifikator (form varierer per samanheng — brukt både for
      digitale adresser og, via brreg-felles-aktoer, for aktørar generelt).
    # TODO: vurder eigen felles-type når/dersom brreg-felles-struktur-typer vert oppretta.

  ip_nummer:
    slot_uri: brreg_felles_adresse:ipNummer
    range: string
    description: "IP-nummeret."

  domenenavn:
    slot_uri: brreg_felles_adresse:domenenavn
    range: string
    description: "Domenenamnet i adressa."

  brukernavn:
    slot_uri: brreg_felles_adresse:brukernavn
    range: string
    description: "Brukarnamnet (lokaldelen) i e-postadressa."

  protokoll:
    slot_uri: brreg_felles_adresse:protokoll
    range: string
    description: "Protokollen for nettadressa, t.d. https."

  filsti:
    slot_uri: brreg_felles_adresse:filsti
    range: string
    description: "Filstien i nettadressa."

  meldingsbokstype:
    slot_uri: brreg_felles_adresse:meldingsbokstype
    range: string
    description: "Kva type digital meldingsboks dette er (t.d. Altinn)."

  prefiks_med_nasjonal_kode:
    slot_uri: brreg_felles_adresse:prefiksMedNasjonalKode
    range: PrefiksMedNasjonalKode
    description: 'Internasjonalt telefonprefiks (landkode), t.d. "+47".'

  nasjonalt_nummer:
    slot_uri: brreg_felles_adresse:nasjonaltNummer
    range: NasjonaltNummer
    description: "Telefonnummeret utan landkode/prefiks."

  navn:
    slot_uri: brreg_felles_adresse:navn
    range: string
    description: "Namnet på ressursen."

  postnummer:
    slot_uri: brreg_felles_adresse:postnummer
    range: Postnummer
    description: "Postnummeret."

  kommunenummer:
    slot_uri: brreg_felles_adresse:kommunenummer
    range: Kommunenummer
    description: "Kommunenummeret."

  kommunenavn:
    slot_uri: brreg_felles_adresse:kommunenavn
    range: string
    description: "Namnet på kommunen."

  fylkesnummer:
    slot_uri: brreg_felles_adresse:fylkesnummer
    range: Fylkesnummer
    description: "Fylkesnummeret."

  fylkesnavn:
    slot_uri: brreg_felles_adresse:fylkesnavn
    range: string
    description: "Namnet på fylket."

  gaardsnummer:
    slot_uri: brreg_felles_adresse:gaardsnummer
    range: integer
    description: "Gårdsnummer i matrikkelen."

  bruksnummer:
    slot_uri: brreg_felles_adresse:bruksnummer
    range: integer
    description: "Bruksnummer i matrikkelen."

  festenummer:
    slot_uri: brreg_felles_adresse:festenummer
    range: integer
    description: "Festenummer i matrikkelen (for festetomter)."

  seksjonsnummer:
    slot_uri: brreg_felles_adresse:seksjonsnummer
    range: integer
    description: "Seksjonsnummer i matrikkelen (for seksjonerte eigedomar)."

  nummer:
    slot_uri: brreg_felles_adresse:nummer
    range: Husnummer
    description: "Husnummeret."

  bokstav:
    slot_uri: brreg_felles_adresse:bokstav
    range: Husbokstav
    description: "Husbokstaven, dersom adressa har ein."
