beskrivelse:
  nb: Gjenbrukbare aktørklassar (Aktør, Virksomhet, Person, Rolle m.fl.) utleia frå
    Brønnøysundregistrene (BR) sin interne BRReferansemodell_v3 (MagicDraw/XMI), pakken
    "Aktør", pluss dei aktør-relaterte komplekstypane frå Strukturtypekatalog_v1 (Personnavn,
    Personidentifikator, Virksomhetsidentifikator) som aktørklassane er avhengige
    av. Importerer brreg-felles-adresse for GeografiskAdresse/DigitalAdresse. Sjå
    specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md for bakgrunn, metode
    og avklaringane denne modellen byggjer på.
  nn: Gjenbrukbare aktørklassar (Aktør, Virksomhet, Person, Rolle m.fl.) utleia frå
    Brønnøysundregistrene (BR) sin interne BRReferansemodell_v3 (MagicDraw/XMI), pakken
    "Aktør", pluss dei aktør-relaterte komplekstypane frå Strukturtypekatalog_v1 (Personnavn,
    Personidentifikator, Virksomhetsidentifikator) som aktørklassane er avhengige
    av. Importerer brreg-felles-adresse for GeografiskAdresse/DigitalAdresse. Sjå
    specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md for bakgrunn, metode
    og avklaringane denne modellen byggjer på.
