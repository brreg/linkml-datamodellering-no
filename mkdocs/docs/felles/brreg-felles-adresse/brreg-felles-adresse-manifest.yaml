beskrivelse:
  nb: 'Gjenbrukbare adresseklassar utleia frå Brønnøysundregistrene (BR) sin interne
    BRReferansemodell_v3 (MagicDraw/XMI), pakken "Adresse" — eit geografisk adressehierarki
    (GeografiskAdresse) og eit digitalt adressehierarki (DigitalAdresse), pluss dei
    adresse-relaterte komplekstypane frå Strukturtypekatalog_v1 (Poststed, Kommune,
    Fylke, Matrikkelnummer, Adressenummer) som adressehierarkiet er avhengig av. Sjå
    specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md for bakgrunn, metode
    og avklaringane denne modellen byggjer på.

    BR sin eigen `Nettadresse`-undertype "Aksesspunkt" er medvite utelaten her: feltet
    `aksesspunktoperatoer` peikar til `Virksomhet` (definert i brreg-felles-aktoer,
    som importerer denne modellen) og ville gjort importgrafen sirkulær. Sjå nemnde
    spec § Funn 4.'
  nn: 'Gjenbrukbare adresseklassar utleia frå Brønnøysundregistrene (BR) sin interne
    BRReferansemodell_v3 (MagicDraw/XMI), pakken "Adresse" — eit geografisk adressehierarki
    (GeografiskAdresse) og eit digitalt adressehierarki (DigitalAdresse), pluss dei
    adresse-relaterte komplekstypane frå Strukturtypekatalog_v1 (Poststed, Kommune,
    Fylke, Matrikkelnummer, Adressenummer) som adressehierarkiet er avhengig av. Sjå
    specs/done/felles-typar-enhetsregisteret-fra-br-katalogar.md for bakgrunn, metode
    og avklaringane denne modellen byggjer på.

    BR sin eigen `Nettadresse`-undertype "Aksesspunkt" er medvite utelaten her: feltet
    `aksesspunktoperatoer` peikar til `Virksomhet` (definert i brreg-felles-aktoer,
    som importerer denne modellen) og ville gjort importgrafen sirkulær. Sjå nemnde
    spec § Funn 4.'
