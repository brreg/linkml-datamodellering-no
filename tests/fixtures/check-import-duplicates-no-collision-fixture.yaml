imports:
  - linkml:types
  - ./check-import-duplicates-base-fixture

slots:
  eige_slot:
    description: Eit slot unikt for dette skjemaet.
    range: string

classes:
  EigenKlasse:
    description: Ein klasse unikt for dette skjemaet, som brukar det importerte slotet.
    slots:
      - felles_slot
      - eige_slot
